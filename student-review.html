<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Review — Exam Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #0a0a0a;
      --navy:     #0f172a;
      --ink:      #1e293b;
      --slate:    #475569;
      --muted:    #94a3b8;
      --line:     #e2e8f0;
      --surface:  #f8fafc;
      --white:    #ffffff;
      --blue:     #2563eb;
      --green:    #16a34a;
      --amber:    #d97706;
      --red:      #dc2626;
      --purple:   #7c3aed;
      --transition: 180ms ease;
    }

    body { font-family: 'Inter', sans-serif; background: var(--white); min-height: 100vh; color: var(--ink); -webkit-font-smoothing: antialiased; }

    /* ── Header ── */
    .header { background: var(--navy); padding: 0 40px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .back-btn { display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.45); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; background: none; border: none; cursor: pointer; font-family: inherit; transition: color var(--transition); }
    .back-btn:hover { color: var(--white); }
    .header-logo img { height: 26px; width: auto; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .user-menu { position: relative; display: flex; align-items: center; }
    .user-menu-btn { display: flex; align-items: center; gap: 7px; background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.6); font-size: 0.78rem; font-weight: 600; font-family: inherit; padding: 5px 8px; transition: color var(--transition); }
    .user-menu-btn:hover { color: rgba(255,255,255,0.9); }
    .user-menu-btn .um-caret { transition: transform var(--transition); }
    .user-menu-btn.open .um-caret { transform: rotate(180deg); }
    .user-dropdown { display: none; position: absolute; right: 0; top: calc(100% + 6px); background: var(--navy); border: 1px solid rgba(255,255,255,0.08); min-width: 160px; z-index: 500; box-shadow: 0 8px 28px rgba(0,0,0,0.35); }
    .user-dropdown.open { display: block; }
    .user-dropdown-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; background: transparent; border: none; color: rgba(255,255,255,0.6); font-size: 0.82rem; font-weight: 500; font-family: inherit; cursor: pointer; text-align: left; transition: all var(--transition); white-space: nowrap; }
    .user-dropdown-item:hover { background: rgba(255,255,255,0.06); color: var(--white); }
    .header-divider { width: 1px; height: 18px; background: rgba(255,255,255,0.1); }
    .header-badge { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.15); padding: 2px 8px; }

    /* ── Page ── */
    .page { max-width: 1100px; margin: 0 auto; padding: 48px 40px 80px; display: flex; flex-direction: column; gap: 20px; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; font-family: inherit; border: 1px solid transparent; padding: 8px 16px; cursor: pointer; white-space: nowrap; transition: all var(--transition); }
    .btn-primary { background: var(--blue); color: var(--white); border-color: var(--blue); }
    .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: none; color: var(--slate); border: 1px solid var(--line); font-size: 0.68rem; padding: 6px 12px; }
    .btn-ghost:hover { border-color: var(--slate); color: var(--black); }
    /* AI button — purple preserved */
    .btn-ai { background: #f5f3ff; color: var(--purple); border: 1px solid #ddd6fe; font-size: 0.68rem; padding: 6px 12px; font-weight: 700; letter-spacing: 0.04em; }
    .btn-ai:hover { background: #ede9fe; }
    .pencil-btn { background: none; border: none; cursor: pointer; color: var(--muted); padding: 2px; display: inline-flex; align-items: center; transition: color var(--transition); }
    .pencil-btn:hover { color: var(--blue); }

    /* ── Student card ── */
    .student-card { background: var(--white); border: 1px solid var(--line); padding: 28px 32px; display: flex; align-items: flex-start; justify-content: space-between; gap: 28px; }
    .student-name { font-size: 1.4rem; font-weight: 700; color: var(--black); line-height: 1; margin-bottom: 6px; letter-spacing: -0.03em; }
    .student-meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; letter-spacing: 0.01em; }
    .contact-row { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--slate); }
    .contact-val { font-weight: 500; }
    .contact-form { display: none; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    .contact-form.visible { display: flex; }
    .contact-input { font-size: 0.82rem; font-family: inherit; border: 1px solid var(--line); padding: 5px 10px; color: var(--black); outline: none; transition: border-color var(--transition); }
    .contact-input:focus { border-color: var(--blue); }
    .score-block { text-align: right; flex-shrink: 0; }
    .score-big { font-size: 2.6rem; font-weight: 700; color: var(--blue); line-height: 1; letter-spacing: -0.04em; }
    .score-big span { font-size: 1.1rem; color: var(--line); font-weight: 500; }
    .score-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-top: 6px; }

    /* ── Section cards ── */
    .section-card { background: var(--white); border: 1px solid var(--line); overflow: hidden; }
    .section-head { padding: 14px 24px; background: var(--navy); display: flex; align-items: center; justify-content: space-between; }
    .section-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.9); }
    .section-score { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; color: rgba(255,255,255,0.4); }

    /* ── MCQ table ── */
    .mcq-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
    .mcq-table th { padding: 10px 24px; text-align: left; font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--line); }
    .mcq-table td { padding: 14px 24px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink); line-height: 1.55; font-weight: 400; }
    .mcq-table tr:last-child td { border-bottom: none; }
    .mcq-table tbody tr:hover td { background: var(--surface); }
    .q-num { font-size: 0.6rem; color: var(--muted); display: block; margin-bottom: 3px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .result-col { text-align: center; font-size: 1rem; width: 56px; }

    /* ── Open questions ── */
    .open-q { padding: 28px 24px; border-bottom: 1px solid var(--line); }
    .open-q:last-child { border-bottom: none; }
    .open-q-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
    .open-q-text { font-size: 0.88rem; font-weight: 600; color: var(--black); line-height: 1.6; margin-bottom: 16px; }
    .answer-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
    .answer-text { font-size: 0.85rem; color: var(--ink); line-height: 1.75; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 20px; }
    .ql-rendered p { margin: 0 0 8px 0; }
    .ql-rendered ol, .ql-rendered ul { padding-left: 20px; margin: 0 0 8px 0; }
    .criteria-toggle { font-size: 0.72rem; font-weight: 600; color: var(--slate); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 14px; user-select: none; letter-spacing: 0.02em; }
    .criteria-toggle:hover { color: var(--black); }
    .criteria-block { background: var(--surface); border: 1px solid var(--line); padding: 12px 16px; margin-bottom: 16px; font-size: 0.82rem; color: var(--slate); line-height: 1.7; white-space: pre-wrap; }
    .score-ai-row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
    .score-field { display: flex; align-items: center; gap: 8px; }
    .score-field-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--slate); }
    .score-text-input {
      font-size: 1.1rem; font-weight: 700; font-family: inherit;
      border: 1px solid var(--line);
      padding: 6px 0; width: 56px; color: var(--black); outline: none;
      text-align: center;
      -moz-appearance: textfield;
      transition: border-color var(--transition);
    }
    .score-text-input::-webkit-outer-spin-button,
    .score-text-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .score-text-input:focus { border-color: var(--blue); }
    .score-of { font-size: 0.85rem; color: var(--muted); font-weight: 500; white-space: nowrap; }

    /* ── AI suggestion — purple preserved ── */
    .ai-suggestion { background: #faf5ff; border: 1px solid #e9d5ff; padding: 16px 18px; margin-bottom: 14px; }
    .ai-suggestion-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .ai-suggestion-meta { display: flex; align-items: center; gap: 10px; }
    .ai-tag { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--purple); }
    .ai-score-chip { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; background: var(--purple); color: #fff; padding: 3px 10px; }
    .ai-hint { font-size: 0.72rem; color: #a78bfa; margin-bottom: 8px; font-style: italic; }
    .ai-text { font-size: 0.82rem; color: #4c1d95; line-height: 1.65; margin-bottom: 14px; }
    .ai-actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .ai-close { background: none; border: none; cursor: pointer; color: #a78bfa; padding: 2px; line-height: 1; transition: color var(--transition); }
    .ai-close:hover { color: var(--purple); }

    @keyframes flashUpdate { 0% { background: #dbeafe; } 100% { background: transparent; } }
    .flash { animation: flashUpdate 0.8s ease-out; }

    .comment-section-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; display: block; }
    .comment-textarea { width: 100%; font-size: 0.83rem; font-family: inherit; border: 1px solid var(--line); padding: 12px 14px; color: var(--ink); outline: none; resize: vertical; min-height: 72px; line-height: 1.65; background: var(--white); transition: border-color var(--transition); }
    .comment-textarea:focus { border-color: var(--blue); }

    /* ── Bottom actions ── */
    .bottom-actions { display: flex; align-items: center; justify-content: space-between; padding: 24px 0 0; border-top: 1px solid var(--line); }
    .bottom-nav { display: flex; gap: 8px; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--navy); color: var(--white); font-size: 0.8rem; font-weight: 600; padding: 10px 20px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999; }
    .toast.show { opacity: 1; }

    .empty-state { padding: 48px 24px; text-align: center; color: var(--muted); font-size: 0.85rem; }

    /* ── Language pill ── */
    .lang-pill { display:flex; border:1px solid rgba(255,255,255,0.15); overflow:hidden; }
    .lang-pill button { padding:4px 10px; background:transparent; border:none; color:rgba(255,255,255,0.4); font-size:0.65rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; font-family:inherit; transition:all var(--transition); }
    .lang-pill button.active { background:rgba(255,255,255,0.12); color:var(--white); }

    @media (max-width: 640px) {
      .header { padding: 0 20px; }
      .page { padding: 24px 20px 60px; gap: 16px; }
      .student-card { flex-direction: column; gap: 16px; padding: 20px; }
      .score-block { align-self: flex-start; }
      .mcq-table { font-size: 0.75rem; }
      .mcq-table th, .mcq-table td { padding: 8px 16px; }
      .result-col { width: 36px; }
      .open-q { padding: 20px 16px; }
      .score-ai-row { flex-direction: column; align-items: flex-start; gap: 10px; }
      .section-head { padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <button class="back-btn" id="backBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        <span data-i18n="backBtn">All submissions</span>
      </button>
      <div class="header-divider"></div>
      <div class="header-logo"><img src="testflo-dark.svg" alt="testflo"></div>
      <div class="header-divider"></div>
      <span class="header-badge" data-i18n="badge">Teacher</span>
    </div>
    <div class="header-right">
      <div id="langToggleMount"></div>
      <div class="user-menu" id="userMenu">
        <button class="user-menu-btn" id="userMenuBtn" onclick="toggleUserMenu()">
          <span id="headerName"></span>
          <svg class="um-caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="user-dropdown" id="userDropdown">
          <button class="user-dropdown-item" onclick="signOutUser()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="page" id="pageContent" style="display:none;"></div>
  <div class="empty-state" id="loadingState">Loading…</div>

  <div class="toast" id="toast"></div>

  <footer style="padding:32px 0;text-align:center;font-size:0.8rem;color:#94a3b8;border-top:1px solid #e2e8f0;">
    testflo &copy; 2026 &nbsp;&middot;&nbsp; <a id="privacyFooterLink" href="privacy.html" style="color:#94a3b8;text-decoration:none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Politique de confidentialité</a>
  </footer>
  <script src="lang.js"></script>
  <script>
    document.getElementById('privacyFooterLink').textContent = (localStorage.getItem('examBuilderLang') || 'fr') === 'en' ? 'Privacy Policy' : 'Politique de confidentialité';
    document.addEventListener('langchange', function() { window.location.reload(); });

    const SUPABASE_URL = 'https://toxgihdyfzdymgidgvaq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRveGdpaGR5ZnpkeW1naWRndmFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2ODQ0OTYsImV4cCI6MjA5MjI2MDQ5Nn0.FOA3ZA8Eh-g231al2DS4NjGfLjIkpRlmb7_fKXz65Xo';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    const params  = new URLSearchParams(window.location.search);
    const attemptId = params.get('attempt');
    const examId    = params.get('exam');

    let attempt   = null;
    let exam      = null;
    let questions = [];
    let allAttemptIds = [];  // sorted alphabetically for prev/next nav
    let currentTeacher = null;
    let currentInstitution = null;

    function goBack() {
      window.location.href = `submissions.html?exam=${examId}&tab=submissions`;
    }

    document.getElementById('backBtn').addEventListener('click', goBack);

    async function init() {
      if (!attemptId || !examId) { goBack(); return; }
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'dashboard.html'; return; }
      await sb.auth.setSession({ access_token: session.access_token, refresh_token: session.refresh_token });

      const { data: teacher } = await sb.from('teachers').select('*').eq('id', session.user.id).single();
      if (!teacher) { window.location.href = 'dashboard.html'; return; }
      currentTeacher = teacher;
      Lang.init(i18n);

      const [attemptRes, examRes, questionsRes, allAttemptsRes, instTeacherRes] = await Promise.all([
        sb.from('exam_attempts').select('*').eq('id', attemptId).single(),
        sb.from('exams').select('*').eq('id', examId).single(),
        sb.from('questions').select('*').eq('exam_id', examId).order('position', { ascending: true }),
        sb.from('exam_attempts').select('id, student_name').eq('exam_id', examId),
        sb.from('institution_teachers').select('institution_id').eq('teacher_id', session.user.id).single()
      ]);

      attempt   = attemptRes.data;
      exam      = examRes.data;
      questions = questionsRes.data || [];
      // Sections are visual dividers — exclude from answer index so it matches exam-engine
      window.answerableQs = questions.filter(q => q.type !== 'section');

      if (!attempt || !exam) { goBack(); return; }

      if (instTeacherRes.data?.institution_id) {
        const { data: inst } = await sb.from('institutions').select('name').eq('id', instTeacherRes.data.institution_id).single();
        currentInstitution = inst;
      }

      // Build sorted nav list (same order as submissions.html)
      allAttemptIds = (allAttemptsRes.data || [])
        .sort((a, b) => (a.student_name || '').localeCompare(b.student_name || ''))
        .map(a => a.id);

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('pageContent').style.display = 'block';
      render();
      // Auto-grade open questions that have grading criteria
      autoGradeAllWithCriteria();
    }

    function formatName(raw) {
      if (!raw) return '—';
      const parts = raw.trim().split(/\s+/);
      if (parts.length < 2) return raw.toUpperCase();
      const last  = parts[parts.length - 1].toUpperCase();
      const first = parts.slice(0, -1).join(' ');
      return `${last} ${first}`;
    }

    function getOptionText(q, idx) {
      const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
      return opts[idx] || '—';
    }

    function render() {
      const answers   = attempt.answers_json || {};
      const openScores   = attempt.open_scores || {};
      const openComments = attempt.open_comments || {};

      const aqs = window.answerableQs || questions.filter(q => q.type !== 'section');
      const mcqQuestions  = aqs.filter(q => q.type === 'mcq');
      const openQuestions = aqs.filter(q => q.type === 'open');

      // Pool filtering — reads pool_selection saved by exam-engine on submit
      const poolSelection = attempt.pool_selection || {};
      const sectionForQ = {};
      let _curSec = null;
      questions.forEach(q => {
        if (q.type === 'section') { _curSec = q; }
        else { const gi = aqs.indexOf(q); if (gi >= 0) sectionForQ[gi] = _curSec; }
      });
      function inPool(gi) {
        const sec = sectionForQ[gi];
        if (!sec || !poolSelection[sec.id]) return true;
        return poolSelection[sec.id].includes(gi);
      }

      // Score display — use server-computed score_mcq (matches submissions.html)
      const openScoreSum = Object.values(openScores).reduce((s, v) => s + (parseFloat(v) || 0), 0);
      const hasOpenScore = Object.keys(openScores).length > 0;
      const mcqScore     = attempt.score_mcq || 0;
      const scoreDisplay = hasOpenScore
        ? (mcqScore + openScoreSum).toFixed(1)
        : mcqScore;
      const visibleMcq  = mcqQuestions.filter(q => inPool(aqs.indexOf(q)));
      const visibleOpen = openQuestions.filter(q => inPool(aqs.indexOf(q)));
      const scoreMax = visibleMcq.length + visibleOpen.reduce((s, q) => s + (q.max_points || 5), 0);

      const submittedDate = attempt.submitted_at
        ? new Date(attempt.submitted_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + ' · ' +
          new Date(attempt.submitted_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        : '—';

      // Nav state
      const curIdx  = allAttemptIds.indexOf(attemptId);
      const prevId  = curIdx > 0 ? allAttemptIds[curIdx - 1] : null;
      const nextId  = curIdx < allAttemptIds.length - 1 ? allAttemptIds[curIdx + 1] : null;

      // Build MCQ table rows
      const _mcqPoolSeen = new Set();
      const mcqRows = mcqQuestions.map((q, i) => {
        const globalIdx   = aqs.indexOf(q);
        if (!inPool(globalIdx)) return '';
        const sec = sectionForQ[globalIdx];
        let poolBanner = '';
        if (sec && poolSelection[sec.id] && !_mcqPoolSeen.has(sec.id)) {
          _mcqPoolSeen.add(sec.id);
          const drawn = poolSelection[sec.id].length;
          const total = Object.values(sectionForQ).filter(s => s?.id === sec.id).length;
          poolBanner = `<tr><td colspan="4" style="background:#eff6ff;border-bottom:1px solid #bfdbfe;font-size:0.7rem;font-weight:700;color:#1e40af;padding:8px 24px;letter-spacing:0.05em;text-transform:uppercase;">Pool — ${drawn} of ${total} questions drawn</td></tr>`;
        }
        const selectedIdx = parseInt(answers['q' + globalIdx], 10);
        const isCorrect   = selectedIdx === q.correct_index;
        const studentAns  = isNaN(selectedIdx) ? '—' : getOptionText(q, selectedIdx);
        const correctAns  = getOptionText(q, q.correct_index);
        return poolBanner + `<tr>
          <td class="ql-rendered"><span class="q-num">Q${globalIdx + 1}</span>${q.question_text || ''}</td>
          <td>${escHtml(studentAns)}</td>
          <td>${escHtml(correctAns)}</td>
          <td class="result-col">${isCorrect ? '✅' : '❌'}</td>
        </tr>`;
      }).join('');

      // Build open question blocks
      const _openPoolSeen = new Set();
      const openBlocks = openQuestions.map((q, i) => {
        const globalIdx = aqs.indexOf(q);
        if (!inPool(globalIdx)) return '';
        const _openSec = sectionForQ[globalIdx];
        let openPoolBanner = '';
        if (_openSec && poolSelection[_openSec.id] && !_openPoolSeen.has(_openSec.id)) {
          _openPoolSeen.add(_openSec.id);
          const drawn = poolSelection[_openSec.id].length;
          const total = Object.values(sectionForQ).filter(s => s?.id === _openSec.id).length;
          openPoolBanner = `<div style="background:#eff6ff;border-bottom:1px solid #bfdbfe;font-size:0.7rem;font-weight:700;color:#1e40af;padding:8px 24px;letter-spacing:0.05em;text-transform:uppercase;">Pool — ${drawn} of ${total} questions drawn</div>`;
        }
        const rawAnswer = answers['q' + globalIdx] || '';
        const savedScore   = openScores[globalIdx] !== undefined ? openScores[globalIdx] : '';
        const savedComment = openComments[globalIdx] || '';
        const maxPts = q.max_points || 5;
        const criteriaHtml = q.grading_criteria
          ? `<div class="criteria-toggle" onclick="toggleCriteria(this)">
               <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
               ${Lang.t('gradingCriteria')}
             </div>
             <div class="criteria-block" style="display:none;">${escHtml(q.grading_criteria)}</div>`
          : '';

        return openPoolBanner + `<div class="open-q" data-qidx="${globalIdx}">
          <div class="open-q-label">Question ${globalIdx + 1}</div>
          <div class="open-q-text ql-rendered">${q.question_text || ''}</div>
          <div class="answer-label">${Lang.t('studentAnswer')}</div>
          <div class="answer-text ql-rendered">${rawAnswer || '<em style="color:#cbd5e1;">No answer provided</em>'}</div>
          ${criteriaHtml}
          <div class="score-ai-row">
            <div class="score-field">
              <span class="score-field-label">Score</span>
              <input type="text" class="score-text-input" value="${escHtml(String(savedScore))}" placeholder="—" data-qidx="${globalIdx}" oninput="updateScoreChip();markUnsaved()">
              <span class="score-of">/ ${maxPts}</span>
            </div>
            <button class="btn btn-ai" onclick="requestAI(this, ${globalIdx})">${Lang.t('aiSuggest')}</button>
          </div>
          <div class="ai-suggestion" id="ai-q${globalIdx}" style="display:none;"></div>
          <span class="comment-section-label">Teacher comment</span>
          <textarea class="comment-textarea" data-qidx="${globalIdx}" oninput="markUnsaved()" placeholder="Add a comment — visible to the student when results are sent.">${escHtml(savedComment)}</textarea>
        </div>`;
      }).join('');

      const html = `
        <!-- Student card -->
        <div class="student-card">
          <div style="flex:1;">
            <div class="student-name" id="displayName">${escHtml(formatName(attempt.student_name))}</div>
            <div class="student-meta">${escHtml(exam.title)} · ${submittedDate}</div>
            <div class="contact-row">
              <span class="contact-val" id="displayEmail">${escHtml(attempt.student_email || '—')}</span>
              <button class="pencil-btn" onclick="openContactForm()" title="Edit contact">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
            </div>
            <div class="contact-form" id="contactForm">
              <input class="contact-input" type="text" id="contactName" value="${escHtml(attempt.student_name || '')}" style="width:165px;" placeholder="Name">
              <input class="contact-input" type="email" id="contactEmail" value="${escHtml(attempt.student_email || '')}" style="width:225px;" placeholder="Email">
              <button class="btn btn-ghost" onclick="saveContact()">Save</button>
              <button class="btn btn-ghost" onclick="closeContactForm()">Cancel</button>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex-shrink:0;">
            <div class="score-block">
              <div class="score-big" id="scoreDisplay" data-mcq="${mcqScore}" data-max="${scoreMax}">${scoreDisplay} <span>/ ${scoreMax}</span></div>
              <div class="score-label">Current score</div>
            </div>
            <button class="btn btn-ghost" id="downloadReportBtn" style="font-size:0.75rem;padding:6px 12px;width:100%;" onclick="generateAndDownload()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span data-i18n="downloadBtn">Download report</span>
            </button>
          </div>
        </div>

        ${(() => {
          // Determine section titles for MCQ and open-question cards.
          // Walk questions in order to build section groups. If no section items exist, fall back to generic labels.
          const sectionItems = questions.filter(q => q.type === 'section');
          const hasSections = sectionItems.length > 0;

          // Map each answerable question to its teacher-defined section title.
          // Walk questions array: whenever we hit a section item, update current title.
          const qSectionTitle = {}; // globalIdx → section title string or null
          let _walkTitle = null;
          questions.forEach(q => {
            if (q.type === 'section') { _walkTitle = q.question_text || null; }
            else {
              const gi = aqs.indexOf(q);
              if (gi >= 0) qSectionTitle[gi] = _walkTitle;
            }
          });

          // Resolve MCQ section title: use title of the first visible MCQ's section.
          let mcqSectionTitle = null;
          for (const q of mcqQuestions) {
            const gi = aqs.indexOf(q);
            if (inPool(gi) && qSectionTitle[gi]) { mcqSectionTitle = qSectionTitle[gi]; break; }
          }
          // Resolve open section title: use title of the first visible open question's section.
          let openSectionTitle = null;
          for (const q of openQuestions) {
            const gi = aqs.indexOf(q);
            if (inPool(gi) && qSectionTitle[gi]) { openSectionTitle = qSectionTitle[gi]; break; }
          }

          const mcqHeader  = hasSections && mcqSectionTitle  ? escHtml(mcqSectionTitle)  : `Section 1 — ${escHtml(exam.title)}`;
          const openHeader = hasSections && openSectionTitle ? escHtml(openSectionTitle) : 'Section 2 — Open questions';

          return `
          ${mcqQuestions.length > 0 ? `
          <!-- MCQ section -->
          <div class="section-card">
            <div class="section-head">
              <span class="section-title">${mcqHeader}</span>
              <span class="section-score">${mcqScore} / ${visibleMcq.length} correct</span>
            </div>
            <table class="mcq-table">
              <thead><tr>
                <th style="width:38%;">Question</th>
                <th>Student Response</th>
                <th>Correct Answer</th>
                <th class="result-col">Result</th>
              </tr></thead>
              <tbody>${mcqRows}</tbody>
            </table>
          </div>` : ''}

          ${openQuestions.length > 0 ? `
          <!-- Open questions section -->
          <div class="section-card">
            <div class="section-head">
              <span class="section-title">${openHeader}</span>
              <span class="section-score">Teacher graded</span>
            </div>
            ${openBlocks}
          </div>` : ''}`;
        })()}

        <!-- Session log -->
        ${(() => {
          const log = attempt.session_log || [];
          if (log.length === 0) return '';
          const flagged = ['Screenshot', 'Copy', 'Paste', 'Anti-cheat', 'Terminat'];
          const hasSuspicious = log.some(e => flagged.some(f => e.label?.includes(f)));
          const rows = log.map(e => {
            const suspicious = flagged.some(f => e.label?.includes(f));
            return `<tr style="${suspicious ? 'background:#fef2f2;' : ''}">
              <td style="padding:5px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap;font-size:0.75rem;color:#64748b;">${escHtml(e.time||'')}</td>
              <td style="padding:5px 10px;border-bottom:1px solid #f1f5f9;font-size:0.78rem;font-weight:${suspicious?'600':'400'};color:${suspicious?'#dc2626':'#1e293b'};">${escHtml(e.label||'')}</td>
              <td style="padding:5px 10px;border-bottom:1px solid #f1f5f9;font-size:0.75rem;color:#64748b;">${escHtml(e.detail||'')}</td>
            </tr>`;
          }).join('');

          // Inference stats
          const ev = e => ((e.label || '') + ' ' + (e.detail || '')).toLowerCase();
          const violationCount  = log.filter(e => ev(e).includes('violation') || ev(e).includes('anti-cheat')).length;
          const pasteCount      = log.filter(e => ev(e).includes('paste') || ev(e).includes('collage') || ev(e).includes('copie')).length;
          const autoSubmitted   = log.some(e => ev(e).includes('auto') || ev(e).includes('terminé') || ev(e).includes('automatique'));
          const modalAbuse      = log.filter(e => ev(e).includes('modal')).length > 1;
          const suspicionCount  = log.filter(e => ev(e).includes('suspendu')).length;
          const isEN            = (typeof Lang !== 'undefined' ? Lang.get() : 'fr') === 'en';

          let bg, border, bodyText;
          const titleText = isEN ? 'SESSION ANALYSIS' : 'ANALYSE DE SESSION';

          if (violationCount >= 3 || (autoSubmitted && pasteCount > 0)) {
            bg = '#fef2f2'; border = '#fecaca';
            const parts = [
              violationCount > 0 ? (isEN ? `${violationCount} exit${violationCount !== 1 ? 's' : ''} detected`        : `${violationCount} sortie${violationCount !== 1 ? 's' : ''} détectée${violationCount !== 1 ? 's' : ''}`) : '',
              pasteCount > 0     ? (isEN ? `${pasteCount} paste attempt${pasteCount !== 1 ? 's' : ''}`                 : `${pasteCount} tentative${pasteCount !== 1 ? 's' : ''} de collage`) : '',
              autoSubmitted      ? (isEN ? 'auto-submitted'                                                             : 'soumission automatique') : '',
            ].filter(Boolean);
            bodyText = isEN
              ? `🔴 High-risk behaviour — ${parts.join(', ')}.`
              : `🔴 Comportement à haut risque — ${parts.join(', ')}.`;
          } else if (violationCount >= 2 || pasteCount > 0 || modalAbuse) {
            bg = '#fefce8'; border = '#fde68a';
            const parts = [
              violationCount > 0 ? (isEN ? `${violationCount} exit${violationCount !== 1 ? 's' : ''} detected`        : `${violationCount} sortie${violationCount !== 1 ? 's' : ''} détectée${violationCount !== 1 ? 's' : ''}`) : '',
              pasteCount > 0     ? (isEN ? `${pasteCount} paste attempt${pasteCount !== 1 ? 's' : ''}`                 : `${pasteCount} tentative${pasteCount !== 1 ? 's' : ''} de collage`) : '',
              modalAbuse         ? (isEN ? 'repeated modal use'                                                         : 'modale utilisée plusieurs fois') : '',
            ].filter(Boolean);
            bodyText = isEN
              ? `🟡 Moderately suspicious behaviour — ${parts.join(', ')}.`
              : `🟡 Comportement modérément suspect — ${parts.join(', ')}.`;
          } else {
            bg = '#f0fdf4'; border = '#bbf7d0';
            bodyText = isEN ? '🟢 No suspicious behaviour detected.' : '🟢 Aucun comportement suspect détecté.';
          }

          const suspLine = suspicionCount > 0
            ? (isEN
                ? ` ${suspicionCount} anti-cheat suspension${suspicionCount !== 1 ? 's' : ''} logged.`
                : ` ${suspicionCount} suspension${suspicionCount !== 1 ? 's' : ''} anti-triche enregistrée${suspicionCount !== 1 ? 's' : ''}.`)
            : '';

          const inferenceBlock = `
            <div style="background:${bg};border:1px solid ${border};padding:12px 16px;font-size:0.82rem;margin-top:12px;border-radius:0;">
              <div style="font-size:0.65rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#94a3b8;margin-bottom:6px;">─────────────────────────────────<br>${titleText}</div>
              <div style="line-height:1.5;">${bodyText}${suspLine}</div>
            </div>`;

          return `<div class="section-card" style="margin-top:16px;">
            <div class="section-head" style="cursor:pointer;user-select:none;" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
              <span class="section-title" style="${hasSuspicious?'color:#dc2626;':''}">${hasSuspicious ? '⚠ ' : ''}Session journal (${log.length} event${log.length!==1?'s':''})</span>
              <span style="font-size:0.72rem;color:#94a3b8;">click to expand</span>
            </div>
            <div style="display:none;">
              <table style="width:100%;border-collapse:collapse;">
                <thead><tr style="background:#f8fafc;">
                  <th style="padding:6px 10px;text-align:left;font-size:0.65rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#94a3b8;border-bottom:1px solid #e2e8f0;">Time</th>
                  <th style="padding:6px 10px;text-align:left;font-size:0.65rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#94a3b8;border-bottom:1px solid #e2e8f0;">Event</th>
                  <th style="padding:6px 10px;text-align:left;font-size:0.65rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#94a3b8;border-bottom:1px solid #e2e8f0;">Detail</th>
                </tr></thead>
                <tbody>${rows}</tbody>
              </table>
              ${inferenceBlock}
            </div>
          </div>`;
        })()}

        <!-- Bottom actions -->
        <div class="bottom-actions">
          <div class="bottom-nav">
            <button class="btn btn-ghost" ${prevId ? `onclick="navigate('${prevId}')"` : 'disabled style="opacity:0.4;"'}>← Previous student</button>
            <button class="btn btn-ghost" ${nextId ? `onclick="navigate('${nextId}')"` : 'disabled style="opacity:0.4;"'}>Next student →</button>
          </div>
          <div>
            <button class="btn btn-primary" id="saveBtn" onclick="saveChanges()" data-i18n="saveBtn">Save changes</button>
            <span id="autoSaveChip" style="font-size:0.72rem;color:#16a34a;font-weight:600;opacity:0;transition:opacity 0.4s;">✓ Auto-saved</span>
          </div>
        </div>`;

      document.getElementById('pageContent').innerHTML = html;
    }

    function escHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function statusBadge(status) {
      const map = {
        'in_progress':  { label: 'In Progress',  bg: '#dbeafe', color: '#1e40af' },
        'submitted':    { label: 'Submitted',     bg: '#fef9c3', color: '#854d0e' },
        'graded':       { label: 'Graded',        bg: '#dcfce7', color: '#166534' },
        'results_sent': { label: 'Results Sent',  bg: '#f1f5f9', color: '#475569' },
      };
      const s = map[status] || { label: status || '—', bg: '#f1f5f9', color: '#475569' };
      return `<span style="background:${s.bg};color:${s.color};padding:2px 10px;font-size:0.68rem;font-weight:700;border-radius:99px;white-space:nowrap;">${s.label}</span>`;
    }

    function toggleCriteria(btn) {
      const block = btn.nextElementSibling;
      const showing = block.style.display !== 'none';
      block.style.display = showing ? 'none' : 'block';
    }

    function openContactForm() {
      document.getElementById('contactForm').classList.add('visible');
    }

    function closeContactForm() {
      document.getElementById('contactForm').classList.remove('visible');
    }

    async function saveContact() {
      const name  = document.getElementById('contactName').value.trim();
      const email = document.getElementById('contactEmail').value.trim();
      const { error } = await sb.from('exam_attempts')
        .update({ student_name: name, student_email: email })
        .eq('id', attemptId);
      if (error) { showToast(Lang.t('errorGeneric')); return; }
      attempt.student_name  = name;
      attempt.student_email = email;
      document.getElementById('displayName').textContent  = formatName(name);
      document.getElementById('displayEmail').textContent = email || '—';
      closeContactForm();
      showToast(Lang.t('contactSaved'));
    }

    // Internal: perform the AI grading fetch and populate the aiBox.
    // Returns true on success, false on failure.
    async function _fetchAIGrade(qIdx) {
      const aqs = window.answerableQs || questions.filter(q => q.type !== 'section');
      const q = aqs[qIdx];
      if (!q) return false;
      const answers = attempt.answers_json || {};
      const studentAnswer = answers['q' + qIdx] || '';
      if (!studentAnswer) return false;

      const aiBox = document.getElementById('ai-q' + qIdx);
      const maxPts = q.max_points || 5;

      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/grade-open-question`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_KEY}`
          },
          body: JSON.stringify({
            question: q.question_text,
            answer: studentAnswer,
            criteria: q.grading_criteria || '',
            max_points: maxPts
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }
        const data = await res.json();
        const suggestedScore = data.score ?? '—';
        const rationale      = data.rationale || '';
        const comment        = data.comment || '';

        aiBox.innerHTML = `
          <div class="ai-suggestion-head">
            <div class="ai-suggestion-meta">
              <span class="ai-tag">${Lang.t('aiTag')}</span>
              <span class="ai-score-chip" id="ai-chip-q${qIdx}">${suggestedScore} / ${maxPts}</span>
            </div>
            <button class="ai-close" onclick="this.closest('.ai-suggestion').style.display='none';updateConfirmAllBtn();" title="Close">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="ai-hint ql-rendered" style="font-style:italic;color:#64748b;font-size:0.75rem;margin-bottom:6px;">${q.question_text || ''}</div>
          <div class="ai-hint">${Lang.t('aiHintWarn')}</div>
          <div class="ai-text">${escHtml(rationale)}</div>
          <div class="ai-actions">
            <button class="btn btn-ghost" onclick="applyScore(${qIdx}, '${suggestedScore}')">${Lang.t('aiUseScore').replace('{score}', suggestedScore).replace('{max}', maxPts)}</button>
            <button class="btn btn-ghost" onclick="applyComment(${qIdx}, ${JSON.stringify(comment).replace(/"/g, '&quot;')})">${Lang.t('aiUseComment')}</button>
          </div>`;
        aiBox.style.display = 'block';
        // Store suggested score on the box for confirmAllGrades
        aiBox.dataset.suggestedScore = suggestedScore;
        aiBox.dataset.qidx = qIdx;
        updateConfirmAllBtn();
        return true;
      } catch (e) {
        console.error('AI grading error:', e);
        return false;
      }
    }

    async function requestAI(btn, qIdx) {
      const aqs = window.answerableQs || questions.filter(q => q.type !== 'section');
      const q = aqs[qIdx];
      if (!q) { showToast(Lang.t('errorGeneric')); return; }
      const answers = attempt.answers_json || {};
      const studentAnswer = answers['q' + qIdx] || '';
      if (!studentAnswer) { showToast(Lang.t('noAnswerToEval')); return; }

      btn.disabled = true;
      btn.textContent = Lang.t('aiThinking');

      // If no grading criteria: show inline notice for 2 seconds, then proceed
      if (!q.grading_criteria) {
        const openQEl = btn.closest('.open-q');
        let notice = openQEl ? openQEl.querySelector('.no-criteria-notice') : null;
        if (!notice && openQEl) {
          notice = document.createElement('div');
          notice.className = 'no-criteria-notice';
          notice.style.cssText = 'font-size:0.78rem;color:#64748b;background:#f8fafc;padding:6px 10px;margin-bottom:8px;border-left:2px solid #cbd5e1;';
          notice.textContent = Lang.t('noCriteriaNotice');
          // Insert before the ai-suggestion box
          const aiBox = document.getElementById('ai-q' + qIdx);
          if (aiBox) aiBox.parentNode.insertBefore(notice, aiBox);
        }
        await new Promise(r => setTimeout(r, 2000));
        const ok = await _fetchAIGrade(qIdx);
        if (!ok) showToast(Lang.t('errorGeneric'), 5500);
        // Remove notice after AI returns
        if (notice && notice.parentNode) notice.parentNode.removeChild(notice);
      } else {
        const ok = await _fetchAIGrade(qIdx);
        if (!ok) showToast(Lang.t('errorGeneric'), 5500);
      }

      btn.disabled = false;
      btn.textContent = Lang.t('aiSuggest');
    }

    // Auto-grade all open questions that have grading_criteria on page load
    async function autoGradeAllWithCriteria() {
      const aqs = window.answerableQs || questions.filter(q => q.type !== 'section');
      const openQs = aqs.filter(q => q.type === 'open' && q.grading_criteria);
      if (openQs.length === 0) return;

      for (const q of openQs) {
        const qIdx = aqs.indexOf(q);
        const answers = attempt.answers_json || {};
        if (!answers['q' + qIdx]) continue; // skip if no answer
        // Mark the AI button as thinking while loading
        const btn = document.querySelector(`.btn-ai[onclick="requestAI(this, ${qIdx})"]`);
        if (btn) { btn.disabled = true; btn.textContent = Lang.t('aiThinking'); }
        await _fetchAIGrade(qIdx);
        if (btn) { btn.disabled = false; btn.textContent = Lang.t('aiSuggest'); }
      }
    }

    // Show/hide the "Confirm all grades" button based on visible AI suggestions
    function updateConfirmAllBtn() {
      const anyVisible = document.querySelectorAll('.ai-suggestion[style*="display: block"], .ai-suggestion[style*="display:block"]').length > 0 ||
        [...document.querySelectorAll('.ai-suggestion')].some(el => el.style.display !== 'none' && el.style.display !== '');
      let bar = document.getElementById('confirmAllBar');
      if (anyVisible) {
        if (!bar) {
          bar = document.createElement('div');
          bar.id = 'confirmAllBar';
          bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#0f172a;padding:12px 40px;display:flex;align-items:center;justify-content:flex-end;gap:12px;z-index:200;border-top:1px solid rgba(255,255,255,0.1);';
          bar.innerHTML = `<span style="font-size:0.78rem;color:#94a3b8;"></span>
            <button class="btn btn-primary" onclick="confirmAllGrades()" style="font-size:0.82rem;padding:10px 22px;">${Lang.t('confirmAllGrades')}</button>`;
          document.body.appendChild(bar);
        }
        // Update count label
        const count = [...document.querySelectorAll('.ai-suggestion')].filter(el => el.style.display !== 'none' && el.style.display !== '').length;
        const label = bar.querySelector('span');
        if (label) label.textContent = count + ' AI suggestion' + (count !== 1 ? 's' : '') + ' pending';
        bar.style.display = 'flex';
      } else {
        if (bar) bar.style.display = 'none';
      }
    }

    async function confirmAllGrades() {
      // For each visible AI suggestion, apply the suggested score if not already set by teacher
      const aiBoxes = [...document.querySelectorAll('.ai-suggestion')].filter(el => el.style.display !== 'none' && el.style.display !== '');
      for (const box of aiBoxes) {
        const qIdx = parseInt(box.dataset.qidx, 10);
        const suggested = box.dataset.suggestedScore;
        if (!isNaN(qIdx) && suggested !== undefined && suggested !== '—') {
          const input = document.querySelector(`.score-text-input[data-qidx="${qIdx}"]`);
          if (input && input.value.trim() === '') {
            // Only auto-fill if teacher hasn't already entered a score
            input.value = suggested;
            flash(input);
          }
        }
      }
      updateScoreChip();
      markUnsaved();
      await saveChanges(true);
      // Hide all AI suggestion boxes and the confirm bar
      aiBoxes.forEach(box => { box.style.display = 'none'; });
      const bar = document.getElementById('confirmAllBar');
      if (bar) bar.style.display = 'none';
    }

    function flash(el) {
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    }

    function updateScoreChip() {
      const chip = document.getElementById('scoreDisplay');
      if (!chip) return;
      const mcqCorrect = parseInt(chip.dataset.mcq || '0', 10);
      const openSum = [...document.querySelectorAll('.score-text-input')]
        .reduce((s, inp) => s + (parseFloat(inp.value) || 0), 0);
      const combined = mcqCorrect + openSum;
      const scoreMax = parseInt(chip.dataset.max || '0', 10);
      chip.innerHTML = `${Number.isInteger(combined) ? combined : combined.toFixed(1)} <span>/ ${scoreMax}</span>`;
    }

    let _unsaved = false;
    let _autoSaveTimer = null;

    function markUnsaved() {
      _unsaved = true;
      const btn = document.getElementById('saveBtn');
      if (btn && !btn.disabled) btn.style.background = '#1d4ed8';
      scheduleAutoSave();
    }

    function scheduleAutoSave() {
      clearTimeout(_autoSaveTimer);
      _autoSaveTimer = setTimeout(() => { saveChanges(true); }, 2500);
    }

    window.addEventListener('beforeunload', e => {
      if (_unsaved) { e.preventDefault(); e.returnValue = ''; }
    });

    function applyScore(qIdx, score) {
      const input = document.querySelector(`.score-text-input[data-qidx="${qIdx}"]`);
      if (input) { input.value = score; flash(input); updateScoreChip(); markUnsaved(); }
    }

    function applyComment(qIdx, comment) {
      const ta = document.querySelector(`.comment-textarea[data-qidx="${qIdx}"]`);
      if (ta) { ta.value = comment; flash(ta); markUnsaved(); }
    }

    async function saveChanges(silent) {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;

      const openScores   = {};
      const openComments = {};

      document.querySelectorAll('.score-text-input').forEach(input => {
        const idx = parseInt(input.dataset.qidx, 10);
        const val = input.value.trim();
        if (val !== '') {
          const parsed = parseFloat(val);
          openScores[idx] = isNaN(parsed) ? 0 : parsed;
        }
      });

      document.querySelectorAll('.comment-textarea').forEach(ta => {
        const idx = parseInt(ta.dataset.qidx, 10);
        openComments[idx] = ta.value.trim();
      });

      // Check if all visible open questions are now graded (idx in openScores handles score=0)
      const openInputIdxs = [...document.querySelectorAll('.score-text-input')]
        .map(inp => parseInt(inp.dataset.qidx, 10));
      const allGraded = openInputIdxs.length > 0 && openInputIdxs.every(idx => idx in openScores);

      const updatePayload = { open_scores: openScores, open_comments: openComments };
      if (allGraded) updatePayload.status = 'graded';

      const { error } = await sb.from('exam_attempts')
        .update(updatePayload)
        .eq('id', attemptId);

      if (error) {
        showToast(Lang.t('errorGeneric'), 5500);
        btn.disabled = false;
        return;
      }

      _unsaved = false;
      if (btn) { btn.disabled = false; btn.style.background = ''; }

      if (silent) {
        // Auto-save: show subtle indicator, don't navigate
        const chip = document.getElementById('autoSaveChip');
        if (chip) { chip.style.opacity = '1'; setTimeout(() => { chip.style.opacity = '0'; }, 1500); }
      } else {
        showToast(Lang.t('saved'));
        setTimeout(() => { goBack(); }, 800);
      }
    }

    function navigate(id) {
      window.location.href = `student-review.html?attempt=${id}&exam=${examId}`;
    }

    function showToast(msg, duration) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), duration || 4000);
    }

    function safeFilename(str) {
      return (str || '').replace(/[^a-zA-Z0-9\-_]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    }

    async function generateAndDownload() {
      const answers      = attempt.answers_json  || {};
      const openScores   = attempt.open_scores   || {};
      const openComments = attempt.open_comments || {};
      const aqs = window.answerableQs || questions.filter(q => q.type !== 'section');

      const btn = document.getElementById('downloadReportBtn');
      const origHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ' + Lang.t('opening');

      try {
        // Build segments for section bars
        const segments = [];
        let cur = null;
        for (const q of questions) {
          if (q.type === 'section') { if (cur) segments.push(cur); cur = {title:q.question_text,questions:[]}; }
          else { if (!cur) cur = {title:null,questions:[]}; cur.questions.push(q); }
        }
        if (cur) segments.push(cur);

        let totalCorrect=0, totalMax=0;
        const segData = segments.map(seg => {
          let sc=0, sm=0;
          seg.questions.forEach(q => {
            const gi = aqs.indexOf(q);
            if (q.type==='open') { sc+=parseFloat(openScores[gi])||0; sm+=q.max_points||5; }
            else { sc+=(parseInt(answers['q'+gi],10)===q.correct_index)?1:0; sm+=1; }
          });
          totalCorrect+=sc; totalMax+=sm;
          return {title:seg.title, questions:seg.questions, sc, sm};
        });

        const instName    = (currentInstitution && currentInstitution.name) || 'testflo';
        const teacherName = currentTeacher ? (currentTeacher.full_name||currentTeacher.email) : '—';
        const displayName = formatName(attempt.student_name);
        const submittedAt = attempt.submitted_at ? new Date(attempt.submitted_at) : null;
        const createdAt   = attempt.created_at   ? new Date(attempt.created_at)   : null;
        const timeUsedMins = (submittedAt&&createdAt) ? Math.round((submittedAt-createdAt)/60000) : null;
        const timeStr = timeUsedMins !== null ? timeUsedMins + ' min' : '—';
        const submittedLabel = submittedAt
          ? submittedAt.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+' '+submittedAt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '—';
        const pct = totalMax>0 ? Math.round((totalCorrect/totalMax)*100) : 0;
        const scoreColor = pct>=70 ? [22,163,74] : pct>=50 ? [217,119,6] : [220,38,38];
        const namedSegs = segData.filter(s => s.title);

        // Fetch testflo SVG logo and convert to PNG via canvas (jsPDF does not support SVG format)
        let testfloLogoB64 = null;
        try {
          const logoRes = await fetch('https://exam.test-flo.com/testflo-dark.svg');
          if (logoRes.ok) {
            const svgText = await logoRes.text();
            testfloLogoB64 = await new Promise(resolve => {
              const img = new Image();
              const svgBlob = new Blob([svgText], { type: 'image/svg+xml' });
              const url = URL.createObjectURL(svgBlob);
              img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 220; canvas.height = 80;
                canvas.getContext('2d').drawImage(img, 0, 0, 220, 80);
                URL.revokeObjectURL(url);
                resolve(canvas.toDataURL('image/png'));
              };
              img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
              img.src = url;
            });
          }
        } catch(e) { /* logo fetch failed — use text fallback */ }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const pageW = doc.internal.pageSize.getWidth();   // 210
        const pageH = doc.internal.pageSize.getHeight();  // 297
        const margin = 14;
        const contentW = pageW - margin * 2;

        // ── 1. DARK NAVY HEADER BAR ──────────────────────────────────
        const headerH = 38;
        doc.setFillColor(15, 23, 42); // #0f172a
        doc.rect(0, 0, pageW, headerH, 'F');

        // testflo logo top-left (PNG converted from SVG) or text fallback
        if (testfloLogoB64) {
          doc.addImage(testfloLogoB64, 'PNG', margin, 2, 22, 8);
        } else {
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8);
          doc.setTextColor(148, 163, 184);
          doc.text('testflo', margin, 9);
        }

        // Exam title — white bold
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(13);
        doc.setTextColor(255, 255, 255);
        doc.text(exam.title || '', margin, 18, { maxWidth: contentW * 0.62 });

        // Student name — white bold, larger, right side
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(14);
        doc.setTextColor(255, 255, 255);
        doc.text(displayName, pageW - margin, 15, { align: 'right' });

        // Student email — muted
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(100, 116, 139); // #64748b
        doc.text(attempt.student_email || '', pageW - margin, 22, { align: 'right' });

        // Submitted date — muted
        doc.text(Lang.t('rptSubmitted') + ' ' + submittedLabel, pageW - margin, 27, { align: 'right' });

        // ── 2. THREE SCORE CARDS ─────────────────────────────────────
        let y = headerH + 8;
        const cardW = (contentW - 8) / 3;
        const cardH = 24;
        const cards = [
          {
            label: Lang.t('rptTotalScore'),
            val: (Number.isInteger(totalCorrect) ? totalCorrect : totalCorrect.toFixed(1)) + ' / ' + totalMax,
            sub: pct + '%',
            valColor: scoreColor
          },
          {
            label: Lang.t('rptTimeUsed'),
            val: (exam.duration_mins ? exam.duration_mins + ' min' : '—'),
            sub: '',
            valColor: [15, 23, 42]
          },
          {
            label: Lang.t('rptGrader'),
            val: teacherName,
            sub: (currentInstitution && currentInstitution.name) || '',
            valColor: [15, 23, 42]
          }
        ];
        cards.forEach((card, i) => {
          const cx = margin + i * (cardW + 4);
          // Card border
          doc.setDrawColor(226, 232, 240); // #e2e8f0
          doc.setFillColor(255, 255, 255);
          doc.rect(cx, y, cardW, cardH, 'FD');
          // Label
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(6.5);
          doc.setTextColor(148, 163, 184);
          doc.text(card.label.toUpperCase(), cx + 5, y + 5);
          // Value
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(i === 2 ? 9 : 14);
          doc.setTextColor(...card.valColor);
          doc.text(String(card.val), cx + 5, y + 14, { maxWidth: cardW - 8 });
          // Sub-label
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(7);
          doc.setTextColor(148, 163, 184);
          doc.text(String(card.sub), cx + 5, y + 21);
        });
        y += cardH + 8;

        // ── 3. SECTION BREAKDOWN ──────────────────────────────────────
        if (namedSegs.length > 0) {
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(7);
          doc.setTextColor(148, 163, 184);
          doc.text('RÉSULTATS PAR PARTIE', margin, y);
          y += 4;
          doc.setDrawColor(241, 245, 249);
          doc.line(margin, y, pageW - margin, y);
          y += 4;

          namedSegs.forEach(s => {
            const p = s.sm > 0 ? s.sc / s.sm : 0;
            const scStr = (Number.isInteger(s.sc) ? s.sc : s.sc.toFixed(1)) + ' / ' + s.sm;
            const labelW = 65;
            const scoreW = 18;
            const barX = margin + labelW + 3;
            const barW = contentW - labelW - scoreW - 6;
            const barH = 3;

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(71, 85, 105); // #475569
            doc.text(s.title || '', margin, y + 2.5, { maxWidth: labelW });

            // Bar background
            doc.setFillColor(226, 232, 240); // #e2e8f0
            doc.rect(barX, y, barW, barH, 'F');
            // Bar fill
            doc.setFillColor(30, 58, 95); // #1e3a5f
            doc.rect(barX, y, barW * p, barH, 'F');

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(100, 116, 139);
            doc.text(scStr, pageW - margin, y + 2.5, { align: 'right' });

            y += 7;
          });
          y += 4;
        }

        // ── 4. QUESTION TABLE ─────────────────────────────────────────
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(7);
        doc.setTextColor(148, 163, 184);
        doc.text(Lang.t('rptAnswers').toUpperCase(), margin, y);
        y += 4;
        doc.setDrawColor(241, 245, 249);
        doc.line(margin, y, pageW - margin, y);
        y += 3;

        // Build table body
        const tableBody = aqs.map(q => {
          const gi = aqs.indexOf(q);
          if (q.type === 'open') {
            const ans = answers['q' + gi] || '—';
            const sc  = openScores[gi] !== undefined ? openScores[gi] : '—';
            const cmt = openComments[gi] || '';
            return {
              question: 'Q' + (gi + 1) + '. ' + (q.question_text || ''),
              studentAns: ans + (cmt ? '\n[' + cmt + ']' : ''),
              correctAns: '—',
              result: sc + ' / ' + (q.max_points || 5) + ' pts',
              type: 'open',
              correct: null
            };
          }
          const sel = parseInt(answers['q' + gi], 10);
          const ok  = sel === q.correct_index;
          const sAns = isNaN(sel) ? '—' : getOptionText(q, sel);
          const cAns = getOptionText(q, q.correct_index);
          return {
            question: 'Q' + (gi + 1) + '. ' + (q.question_text || ''),
            studentAns: sAns,
            correctAns: cAns,
            result: '',
            type: 'mcq',
            correct: ok
          };
        });

        doc.autoTable({
          startY: y,
          margin: { left: margin, right: margin },
          head: [[
            Lang.t('rptQuestion'),
            Lang.t('rptStudentAns'),
            Lang.t('rptCorrectAns'),
            Lang.t('rptResult')
          ]],
          body: tableBody.map(r => [r.question, r.studentAns, r.correctAns, r.result]),
          styles: {
            font: 'helvetica',
            fontSize: 8,
            cellPadding: 3,
            lineColor: [226, 232, 240],
            lineWidth: 0.1,
            overflow: 'linebreak',
            valign: 'top'
          },
          headStyles: {
            fillColor: [248, 250, 252],
            textColor: [148, 163, 184],
            fontStyle: 'bold',
            fontSize: 6.5
          },
          alternateRowStyles: {
            fillColor: [252, 253, 254]
          },
          columnStyles: {
            0: { cellWidth: 58 },
            1: { cellWidth: 52 },
            2: { cellWidth: 52 },
            3: { cellWidth: 18, halign: 'center' }
          },
          didParseCell: function(data) {
            const row = tableBody[data.row.index];
            if (!row) return;
            if (data.column.index === 1 && row.type === 'mcq' && row.correct === false) {
              data.cell.styles.textColor = [220, 38, 38]; // #dc2626
            }
            if (data.column.index === 3) {
              if (row.type === 'mcq' && row.correct === true) {
                data.cell.styles.textColor = [22, 163, 74]; // green
              } else if (row.type === 'mcq' && row.correct === false) {
                data.cell.styles.textColor = [220, 38, 38]; // red
              } else if (row.type === 'open') {
                data.cell.styles.textColor = [71, 85, 105];
                data.cell.styles.fontStyle = 'bold';
              }
            }
            if (data.column.index === 1 && row.type === 'open') {
              data.cell.styles.fontSize = 8;
            }
          },
          didDrawCell: function(data) {
            if (data.column.index !== 3) return;
            const row = tableBody[data.row.index];
            if (!row || row.type !== 'mcq') return;
            const cx = data.cell.x + data.cell.width / 2;
            const cy = data.cell.y + data.cell.height / 2;
            const r = 3;
            if (row.correct) {
              doc.setFillColor(22, 163, 74);
            } else {
              doc.setFillColor(220, 38, 38);
            }
            doc.circle(cx, cy, r, 'F');
            doc.setDrawColor(255, 255, 255);
            doc.setLineWidth(0.6);
            if (row.correct) {
              doc.line(cx - 1.4, cy + 0.1, cx - 0.2, cy + 1.3);
              doc.line(cx - 0.2, cy + 1.3, cx + 1.6, cy - 1.0);
            } else {
              doc.line(cx - 1.2, cy - 1.2, cx + 1.2, cy + 1.2);
              doc.line(cx + 1.2, cy - 1.2, cx - 1.2, cy + 1.2);
            }
            doc.setLineWidth(0.2);
          }
        });

        // ── 5. FOOTER ─────────────────────────────────────────────────
        const footerH = 12;
        const finalY = pageH - footerH;

        // Draw separator line
        doc.setDrawColor(226, 232, 240);
        doc.line(margin, finalY - 1, pageW - margin, finalY - 1);

        // Left: institution logo or name (never 'testflo' default)
        const footerInstName = (currentInstitution && currentInstitution.name) || teacherName;
        if (currentInstitution && currentInstitution.logo_url) {
          try {
            doc.addImage(currentInstitution.logo_url, 'PNG', margin, finalY + 1, 20, 8);
          } catch(e) {
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(7);
            doc.setTextColor(148, 163, 184);
            doc.text(footerInstName, margin, finalY + 6);
          }
        } else {
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(7);
          doc.setTextColor(148, 163, 184);
          doc.text(footerInstName, margin, finalY + 6);
        }

        // Right: testflo branding (PNG format — SVG is not supported by jsPDF addImage)
        if (testfloLogoB64) {
          try {
            doc.addImage(testfloLogoB64, 'PNG', pageW - margin - 22, finalY + 1, 22, 8);
          } catch(e) {
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(7);
            doc.setTextColor(100, 116, 139);
            doc.text('testflo', pageW - margin, finalY + 6, { align: 'right' });
          }
        } else {
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(7);
          doc.setTextColor(100, 116, 139);
          doc.text('testflo', pageW - margin, finalY + 6, { align: 'right' });
        }

        // ── SAVE ──────────────────────────────────────────────────────
        const fname = 'rapport-' + safeFilename(attempt.student_name) + '-' + safeFilename(exam.title) + '.pdf';
        doc.save(fname);

      } catch(err) {
        console.error('PDF generation error:', err);
        showToast(Lang.t('errorGeneric'), 5500);
      }

      btn.disabled = false;
      btn.innerHTML = origHtml;
    }

    function toggleUserMenu() {
      var d = document.getElementById('userDropdown');
      var b = document.getElementById('userMenuBtn');
      var isOpen = d.classList.contains('open');
      d.classList.toggle('open', !isOpen);
      b.classList.toggle('open', !isOpen);
    }
    function signOutUser() { sb.auth.signOut().then(function() { window.location.href = 'login.html'; }); }
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#userMenu')) {
        var d = document.getElementById('userDropdown');
        var b = document.getElementById('userMenuBtn');
        if (d) { d.classList.remove('open'); }
        if (b) { b.classList.remove('open'); }
      }
