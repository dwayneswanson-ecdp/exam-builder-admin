<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>testflo — Résultats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a; --navy: #0f172a; --ink: #1e293b; --slate: #475569;
    --muted: #94a3b8; --line: #e2e8f0; --surface: #f8fafc; --white: #ffffff;
    --blue: #2563eb; --green: #16a34a; --amber: #d97706; --red: #dc2626;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--surface);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding-top: 56px;
    min-height: 100vh;
  }

  /* ── Header ───────────────────────────────────────────────────────────────── */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--navy);
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-text {
    font-size: 1.1rem; font-weight: 800; color: #fff;
    letter-spacing: -0.03em; line-height: 1;
  }
  .header-badge {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(255,255,255,0.45); padding-top: 2px;
  }

  /* ── Main layout ──────────────────────────────────────────────────────────── */
  main { max-width: 720px; margin: 0 auto; padding: 36px 20px 80px; }

  /* ── Loading / error ──────────────────────────────────────────────────────── */
  .state-wrap { display: flex; justify-content: center; padding: 80px 20px; }
  .state-card {
    background: var(--white); border: 1px solid var(--line);
    padding: 48px 36px; text-align: center; max-width: 440px; width: 100%;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--line); border-top-color: var(--blue);
    border-radius: 50%; animation: spin 0.75s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-card p { font-size: 0.9rem; color: var(--slate); }
  .state-card .err-icon { margin-bottom: 16px; }
  .state-card .err-title { font-size: 1.05rem; font-weight: 700; color: var(--black); margin-bottom: 8px; }

  /* ── Exam identity card ───────────────────────────────────────────────────── */
  .exam-id-card {
    background: var(--white); border: 1px solid var(--line);
    border-top: 4px solid var(--navy);
    padding: 28px 32px; margin-bottom: 24px;
  }
  .exam-id-eyebrow {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .exam-id-title {
    font-size: 1.25rem; font-weight: 700; color: var(--black);
    letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 10px;
  }
  .exam-id-meta {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    font-size: 0.8rem; color: var(--muted);
  }
  .exam-id-name { font-weight: 600; color: var(--slate); font-size: 0.88rem; }
  .exam-id-sep { color: var(--line); }

  /* ── Score card ───────────────────────────────────────────────────────────── */
  .score-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 0; margin-bottom: 24px;
  }
  .score-cell {
    background: var(--white); border: 1px solid var(--line);
    padding: 24px 28px;
  }
  .score-cell:first-child { border-right: none; }
  .score-cell .sc-label {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
  }
  .score-cell .sc-value {
    font-size: 2.2rem; font-weight: 800; color: var(--black);
    line-height: 1; letter-spacing: -0.03em;
  }
  .score-cell .sc-sub { font-size: 0.78rem; color: var(--slate); margin-top: 6px; }
  .score-cell .sc-date { font-size: 0.95rem; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .score-cell .sc-group { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  /* ── Intro card ───────────────────────────────────────────────────────────── */
  .intro-card {
    background: var(--white); border: 1px solid var(--line);
    padding: 22px 28px; margin-bottom: 20px;
    display: flex; align-items: flex-start; gap: 16px;
  }
  .intro-card svg { flex-shrink: 0; margin-top: 2px; color: var(--muted); }
  .intro-card-body { flex: 1; }
  .intro-greeting { font-size: 0.95rem; font-weight: 700; color: var(--black); margin-bottom: 4px; }
  .intro-body { font-size: 0.85rem; color: var(--slate); line-height: 1.6; margin-bottom: 8px; }
  .intro-contact { font-size: 0.82rem; color: var(--slate); }
  .intro-contact a { color: var(--blue); text-decoration: none; }
  .intro-contact strong { color: var(--ink); }

  /* ── Section bar ──────────────────────────────────────────────────────────── */
  .section-bar {
    background: var(--navy); padding: 10px 20px;
    border: 1px solid var(--navy); border-bottom: none;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .section-bar span {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.8);
  }
  .section-score {
    font-size: 0.78rem; font-weight: 700; color: rgba(255,255,255,0.6);
    white-space: nowrap; flex-shrink: 0;
  }
  .section-score strong { color: #fff; font-size: 0.88rem; }

  /* ── Question cards (shared for MCQ + open) ──────────────────────────────── */
  .q-card-list {
    background: var(--white); border: 1px solid var(--line); border-top: none;
  }
  .q-card-item {
    padding: 20px 24px; border-bottom: 1px solid var(--line);
  }
  .q-card-item:last-child { border-bottom: none; }
  .q-card-item:nth-child(even) { background: #fafbfd; }

  /* meta row: question number left, result/score right */
  .q-card-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; gap: 12px;
  }
  .q-card-num {
    font-size: 0.58rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
  }
  .q-card-result { font-size: 1rem; font-weight: 800; flex-shrink: 0; }
  .q-card-result.ok { color: var(--green); }
  .q-card-result.bad { color: var(--red); }
  .q-score-badge {
    font-size: 0.78rem; font-weight: 700; color: var(--slate);
    background: var(--surface); border: 1px solid var(--line);
    padding: 3px 10px; white-space: nowrap; flex-shrink: 0;
  }
  .q-score-badge .score-val { font-size: 0.95rem; font-weight: 800; color: var(--black); }

  /* question text — renders Quill HTML */
  .q-card-text {
    font-size: 0.9rem; font-weight: 600; color: var(--black);
    line-height: 1.6; margin-bottom: 14px;
  }
  .q-card-text p { margin: 0 0 6px; }
  .q-card-text p:last-child { margin-bottom: 0; }
  .q-card-text ol, .q-card-text ul { margin: 6px 0 0 20px; padding: 0; }
  .q-card-text li { margin-bottom: 4px; font-weight: 400; color: var(--ink); }
  .q-card-text strong { font-weight: 700; }
  .q-card-text em { font-style: italic; }

  /* MCQ answer rows */
  .mcq-answer-row {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 0.82rem; line-height: 1.5; margin-bottom: 4px;
  }
  .mcq-answer-row:last-child { margin-bottom: 0; }
  .mcq-ans-label {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 3px;
  }
  .mcq-ans-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; font-size: 0.82rem; line-height: 1.4;
  }
  .mcq-ans-pill.correct-ans { background: #f0fdf4; border-left: 3px solid var(--green); color: var(--ink); }
  .mcq-ans-pill.wrong-ans   { background: #fef2f2; border-left: 3px solid var(--red);   color: var(--red); font-weight: 600; }
  .mcq-ans-pill.no-ans      { background: var(--surface); border-left: 3px solid var(--line); color: var(--muted); font-style: italic; }

  /* open question fields */
  .q-card-fields { display: flex; flex-direction: column; gap: 12px; }
  .q-card-field-label {
    font-size: 0.58rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 5px;
  }
  /* student response — renders Quill HTML */
  .q-card-response {
    font-size: 0.85rem; color: var(--slate); line-height: 1.7;
    background: var(--surface); padding: 12px 16px;
    border-left: 3px solid var(--line);
  }
  .q-card-response p { margin: 0 0 8px; }
  .q-card-response p:last-child { margin-bottom: 0; }
  .q-card-response ol, .q-card-response ul { margin: 4px 0 0 20px; }
  .q-card-response li { margin-bottom: 4px; }
  /* teacher comment */
  .q-card-comment {
    font-size: 0.85rem; color: var(--ink); line-height: 1.7;
    padding: 12px 16px; background: #fffbeb; border-left: 3px solid #fcd34d;
  }

  /* bottom cap */
  .table-end { border: 1px solid var(--line); border-top: none; height: 0; margin-bottom: 24px; }
  .pool-note {
    border: 1px solid var(--line); border-top: none;
    background: var(--white); padding: 8px 16px;
    font-size: 0.72rem; color: var(--muted);
    margin-bottom: 24px;
  }

  /* ── Contact ──────────────────────────────────────────────────────────────── */
  .contact-card {
    background: var(--white); border: 1px solid var(--line);
    padding: 24px 28px; margin-top: 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .contact-card svg { flex-shrink: 0; color: var(--muted); }
  .contact-text { font-size: 0.82rem; color: var(--slate); }
  .contact-text strong { color: var(--ink); }
  .contact-text a { color: var(--blue); text-decoration: none; }

  /* ── Footer ───────────────────────────────────────────────────────────────── */
  footer {
    text-align: center; font-size: 0.72rem; color: var(--muted);
    padding: 24px 20px 40px;
  }

  @media (max-width: 540px) {
    main { padding: 24px 12px 60px; }
    header { padding: 0 20px; }
    .score-grid { grid-template-columns: 1fr; }
    .score-cell:first-child { border-right: 1px solid var(--line); border-bottom: none; }
    .exam-id-card { padding: 22px 20px; }
    .score-cell { padding: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <span class="logo-text">testflo</span>
  </div>
  <span class="header-badge">Résultats d'examen</span>
</header>

<main id="main">
  <div class="state-wrap">
    <div class="state-card">
      <div class="spinner"></div>
      <p id="loading-msg">Chargement de vos résultats…</p>
    </div>
  </div>
</main>

<footer id="footer" style="display:none;"></footer>

<script>
const SUPABASE_URL = 'https://toxgihdyfzdymgidgvaq.supabase.co';
const GET_RESULTS_FN = `${SUPABASE_URL}/functions/v1/get-results`;

const params = new URLSearchParams(window.location.search);
const attemptId = params.get('attempt');

function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function stripHtml(html) {
  return (html||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<\/li>/gi,'\n')
    .replace(/<li>/gi,'• ').replace(/<[^>]+>/g,'')
    .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
}

// Safe HTML renderer — keeps Quill formatting tags, strips dangerous content
function renderHtml(html) {
  if (!html) return '';
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('script,style,iframe,object,embed,form,input,button,link').forEach(el => el.remove());
  div.querySelectorAll('*').forEach(el => {
    Array.from(el.attributes).forEach(attr => {
      if (attr.name.startsWith('on') || (attr.name === 'href' && /^javascript:/i.test(attr.value))) {
        el.removeAttribute(attr.name);
      }
    });
  });
  // Clean up empty Quill paragraphs at top/bottom
  const children = Array.from(div.children);
  while (children.length && children[0].matches('p') && !children[0].textContent.trim()) {
    children.shift().remove();
  }
  while (children.length && children[children.length - 1].matches('p') && !children[children.length - 1].textContent.trim()) {
    children.pop().remove();
  }
  return div.innerHTML;
}

// Render MCQ questions as vertical cards
function renderMcqCards(mcqRows, T) {
  if (!mcqRows.length) return '';
  let html = '<div class="q-card-list">';
  mcqRows.forEach((r, i) => {
    const resultCls = r.isCorrect ? 'ok' : 'bad';
    const resultIcon = r.isCorrect ? '✓' : '✗';
    html += `<div class="q-card-item">
      <div class="q-card-meta">
        <span class="q-card-num">${T.questionCol} ${i + 1}</span>
        <span class="q-card-result ${resultCls}">${resultIcon}</span>
      </div>
      <div class="q-card-text">${renderHtml(r.q.question_text) || `<em>Q${i + 1}</em>`}</div>`;

    html += `<div class="mcq-ans-label">${T.studentAns}</div>`;
    if (r.studentText) {
      const pillCls = r.isCorrect ? 'correct-ans' : 'wrong-ans';
      html += `<div class="mcq-ans-pill ${pillCls}">${esc(r.studentText)}</div>`;
    } else {
      html += `<div class="mcq-ans-pill no-ans">${T.noAnswer}</div>`;
    }
    if (!r.isCorrect) {
      html += `<div class="mcq-ans-label" style="margin-top:8px;">${T.correctAns}</div>
        <div class="mcq-ans-pill correct-ans">${esc(r.correctText)}</div>`;
    }
    html += `</div>`;
  });
  html += '</div>';
  return html;
}

// Render open questions as vertical cards
function renderOpenCards(openRows, T) {
  const items = openRows.filter(r => r.response || r.comment || r.score != null);
  if (!items.length) return '';
  let html = '<div class="q-card-list">';
  items.forEach((r, i) => {
    const scoreHtml = r.score != null
      ? `<span class="q-score-badge"><span class="score-val">${r.score}</span> / ${r.q.max_points ?? '?'}</span>`
      : '';
    html += `<div class="q-card-item">
      <div class="q-card-meta">
        <span class="q-card-num">${T.questionCol} ${i + 1}</span>
        ${scoreHtml}
      </div>
      <div class="q-card-text">${renderHtml(r.q.question_text) || `<em>Q${i + 1}</em>`}</div>
      <div class="q-card-fields">`;
    if (r.response) {
      html += `<div>
        <p class="q-card-field-label">${T.openResp}</p>
        <div class="q-card-response">${renderHtml(r.response)}</div>
      </div>`;
    }
    if (r.comment) {
      html += `<div>
        <p class="q-card-field-label">${T.openComment}</p>
        <div class="q-card-comment">${esc(r.comment)}</div>
      </div>`;
    }
    html += `</div></div>`;
  });
  html += '</div>';
  return html;
}

function showError(title, msg) {
  document.getElementById('main').innerHTML = `
    <div class="state-wrap">
      <div class="state-card">
        <div class="err-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <p class="err-title">${esc(title)}</p>
        <p>${esc(msg)}</p>
      </div>
    </div>`;
}

async function load() {
  if (!attemptId) { showError('Lien invalide', 'Aucun identifiant de résultats trouvé dans ce lien.'); return; }

  let data;
  try {
    const res = await fetch(`${GET_RESULTS_FN}?attempt=${encodeURIComponent(attemptId)}`);
    data = await res.json();
    if (!res.ok) {
      const msg = res.status === 410
        ? 'Ces résultats ne sont plus disponibles.'
        : (data.error || 'Impossible de charger les résultats.');
      showError('Résultats introuvables', msg);
      return;
    }
  } catch(e) {
    showError('Erreur réseau', 'Impossible de se connecter. Vérifiez votre connexion et réessayez.');
    return;
  }

  render(data);
}

function render(data) {
  const { attempt, exam, questions, teacher, score_max } = data;
  const lang = exam.lang === 'en' ? 'en' : 'fr';

  const T = lang === 'en' ? {
    headerBadge:   'Exam results',
    scoreLabel:    'Total Score', dateLabel: 'Date',
    submittedOn:   'Submitted on', groupLabel: 'Group',
    noAnswer:      'No answer', studentAns: 'Your answer', correctAns: 'Correct answer', resultCol: 'Result',
    poolNote:      'Questions shown reflect those served to this student.',
    contactTitle:  'Questions about your results?',
    contactLine:   'Contact your instructor:',
    footerNote:    'This page was generated automatically by testflo.',
    openResp:      'Response', openComment: 'Teacher comment', openScore: 'Score',
    questionCol:   'Question',
    introGreeting: n => `Hello ${n},`,
    introBody:     t => `Below are the results of your exam: ${t}. If you have any questions about your results, please contact your instructor.`,
    introContact:  'Instructor:',
  } : {
    headerBadge:   'Résultats d\'examen',
    scoreLabel:    'Score Total', dateLabel: 'Date',
    submittedOn:   'Soumis le', groupLabel: 'Groupe',
    noAnswer:      'Sans réponse', studentAns: 'Votre réponse', correctAns: 'Bonne réponse', resultCol: 'Résultat',
    poolNote:      'Les questions affichées correspondent à celles qui vous ont été présentées.',
    contactTitle:  'Des questions sur vos résultats ?',
    contactLine:   'Contactez votre enseignant :',
    footerNote:    'Cette page a été générée automatiquement par testflo.',
    openResp:      'Réponse', openComment: 'Commentaire de l\'enseignant', openScore: 'Note',
    questionCol:   'Question',
    introGreeting: n => `Bonjour ${n},`,
    introBody:     t => `Vous trouverez ci-dessous les résultats de votre épreuve : ${t}. Pour toute question concernant vos résultats, veuillez contacter votre enseignant.`,
    introContact:  'Enseignant :',
  };

  // Update header badge and page title
  document.querySelector('.header-badge').textContent = T.headerBadge;
  document.title = `testflo — ${exam.title}`;
  if (lang === 'en') document.documentElement.lang = 'en';

  const answersJson   = attempt.answers_json   || {};
  const openScores    = attempt.open_scores    || {};
  const openComments  = attempt.open_comments  || {};
  const poolSel       = attempt.pool_selection || {};
  const poolActive    = Object.keys(poolSel).length > 0;

  // Compute score
  const scoreMcq = attempt.score_mcq;
  let openTotal = 0, openCount = 0;
  Object.values(openScores).forEach(v => { openTotal += Number(v); openCount++; });
  const hasOpen = openCount > 0;
  const scoreObtained = scoreMcq != null ? (hasOpen ? scoreMcq + openTotal : scoreMcq) : null;
  const scoreDisplay  = scoreObtained != null ? scoreObtained : '—';
  const scoreMaxDisp  = score_max || exam.score_max || '—';
  const pct = scoreObtained != null && score_max > 0 ? Math.round((scoreObtained / score_max) * 100) : null;

  // First name extraction (last word of name, common in francophone convention)
  const nameParts = attempt.student_name.trim().split(/\s+/);
  const firstName = nameParts.length > 1 ? nameParts[nameParts.length - 1] : nameParts[0];

  // Intro card
  const institution = exam.institution_name || '';
  const teacherContact = teacher.name || teacher.email
    ? `<span class="intro-contact">${T.introContact} ${teacher.name ? `<strong>${esc(teacher.name)}</strong>` : ''}${teacher.name && teacher.email ? ' — ' : ''}${teacher.email ? `<a href="mailto:${esc(teacher.email)}">${esc(teacher.email)}</a>` : ''}</span>`
    : '';

  let html = `
    <div class="intro-card">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <div class="intro-card-body">
        <p class="intro-greeting">${esc(T.introGreeting(firstName))}</p>
        <p class="intro-body">${esc(T.introBody(exam.title))}</p>
        ${teacherContact}
      </div>
    </div>`;

  // Exam identity card
  html += `
    <div class="exam-id-card">
      ${institution ? `<p class="exam-id-eyebrow">${esc(institution)}</p>` : ''}
      <h1 class="exam-id-title">${esc(exam.title)}</h1>
      <div class="exam-id-meta">
        <span class="exam-id-name">${esc(attempt.student_name)}</span>
        ${attempt.group_name ? `<span class="exam-id-sep">·</span><span>${esc(attempt.group_name)}</span>` : ''}
        <span class="exam-id-sep">·</span>
        <span>${T.submittedOn} ${fmtDate(attempt.submitted_at)}</span>
      </div>
    </div>`;

  // Score grid
  html += `
    <div class="score-grid">
      <div class="score-cell">
        <p class="sc-label">${T.scoreLabel}</p>
        <p class="sc-value">${scoreDisplay}<span style="font-size:1.2rem;font-weight:600;color:var(--muted);"> / ${scoreMaxDisp}</span></p>
        ${pct != null ? `<p class="sc-sub">${pct}%</p>` : ''}
      </div>
      <div class="score-cell">
        <p class="sc-label">${T.dateLabel}</p>
        <p class="sc-date">${fmtDate(attempt.submitted_at)}</p>
        ${attempt.group_name ? `<p class="sc-group">${esc(attempt.group_name)}</p>` : ''}
      </div>
    </div>`;

  // Q&A breakdown
  const hasSections = questions.some(q => q.type === 'section');
  let anyPoolActive = false;

  if (hasSections) {
    const groups = [];
    let cur = { title: '', sectionId: null, mcq: [], open: [] };
    let gIdx = 0;

    for (const q of questions) {
      if (q.type === 'section') {
        if (cur.mcq.length || cur.open.length || cur.title) groups.push(cur);
        cur = { title: stripHtml(q.question_text), sectionId: q.id, mcq: [], open: [] };
      } else {
        const drawn = (cur.sectionId && poolSel[cur.sectionId]) ? poolSel[cur.sectionId] : null;
        const include = drawn ? drawn.includes(gIdx) : true;
        if (!include) { gIdx++; continue; }
        if (drawn) anyPoolActive = true;

        const rawAns = answersJson['q' + gIdx];
        if (q.type === 'mcq') {
          const selIdx = (rawAns !== undefined && rawAns !== null) ? parseInt(rawAns, 10) : -1;
          const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
          const isCorrect = selIdx >= 0 && selIdx === q.correct_index;
          cur.mcq.push({
            q, idx: gIdx, selIdx,
            studentText: selIdx >= 0 ? (stripHtml(opts[selIdx]) || '—') : null,
            correctText: q.correct_index >= 0 ? (stripHtml(opts[q.correct_index]) || '—') : '—',
            isCorrect,
          });
        } else if (q.type === 'open') {
          cur.open.push({
            q, idx: gIdx,
            response: typeof rawAns === 'string' ? rawAns : '',
            score:    openScores[gIdx] != null ? openScores[gIdx] : null,
            comment:  openComments[gIdx] || '',
          });
        }
        gIdx++;
      }
    }
    if (cur.mcq.length || cur.open.length || cur.title) groups.push(cur);

    for (const g of groups) {
      if (!g.mcq.length && !g.open.length) continue;

      // Per-section score
      let secScoreHtml = '';
      if (g.mcq.length) {
        const correct = g.mcq.filter(r => r.isCorrect).length;
        secScoreHtml = `<span class="section-score"><strong>${correct}</strong> / ${g.mcq.length}</span>`;
      } else if (g.open.some(r => r.score != null)) {
        const earned = g.open.reduce((s, r) => s + (r.score ?? 0), 0);
        const max    = g.open.reduce((s, r) => s + (r.q.max_points ?? 0), 0);
        secScoreHtml = `<span class="section-score"><strong>${earned}</strong> / ${max}</span>`;
      }

      html += `<div class="section-bar"><span>${esc(g.title || '')}</span>${secScoreHtml}</div>`;
      html += renderMcqCards(g.mcq, T);
      html += renderOpenCards(g.open, T);
    }

  } else {
    // Flat list, no sections
    const mcqRows = [], openRows = [];
    let gIdx = 0;
    for (const q of questions) {
      if (q.type === 'section') continue;
      const rawAns = answersJson['q' + gIdx];
      if (q.type === 'mcq') {
        const selIdx = (rawAns !== undefined && rawAns !== null) ? parseInt(rawAns, 10) : -1;
        const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
        mcqRows.push({
          q, idx: gIdx, selIdx,
          studentText: selIdx >= 0 ? (stripHtml(opts[selIdx]) || '—') : null,
          correctText: q.correct_index >= 0 ? (stripHtml(opts[q.correct_index]) || '—') : '—',
          isCorrect: selIdx >= 0 && selIdx === q.correct_index,
        });
      } else if (q.type === 'open') {
        openRows.push({
          q, idx: gIdx,
          response: typeof rawAns === 'string' ? rawAns : '',
          score: openScores[gIdx] != null ? openScores[gIdx] : null,
          comment: openComments[gIdx] || '',
        });
      }
      gIdx++;
    }

    if (mcqRows.length) {
      html += `<div class="section-bar"><span>${lang === 'en' ? 'Multiple choice' : 'Questions à choix multiple'}</span></div>`;
      html += renderMcqCards(mcqRows, T);
    }
    if (openRows.some(r => r.response || r.comment || r.score != null)) {
      html += `<div class="section-bar" style="margin-top:20px;"><span>${lang === 'en' ? 'Written questions' : 'Questions rédigées'}</span></div>`;
      html += renderOpenCards(openRows, T);
    }
  }

  // Bottom border cap
  html += `<div class="table-end"></div>`;

  if (anyPoolActive || poolActive) {
    html = html.replace('<div class="table-end"></div>', `<p class="pool-note">${T.poolNote}</p>`);
  }

  // Contact block
  if (teacher.name || teacher.email) {
    html += `<div class="contact-card">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <div class="contact-text">
        <p>${T.contactTitle}</p>
        <p>
          ${teacher.name ? `<strong>${esc(teacher.name)}</strong>` : ''}
          ${teacher.name && teacher.email ? ' — ' : ''}
          ${teacher.email ? `<a href="mailto:${esc(teacher.email)}">${esc(teacher.email)}</a>` : ''}
        </p>
      </div>
    </div>`;
  }

  document.getElementById('main').innerHTML = html;
  const footer = document.getElementById('footer');
  footer.textContent = T.footerNote;
  footer.style.display = 'block';
}

load();
</script>
</body>
</html>
