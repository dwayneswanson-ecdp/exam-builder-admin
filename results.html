<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>testflo — Résultats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a; --navy: #0f172a; --ink: #1e293b; --slate: #475569;
    --muted: #94a3b8; --line: #e2e8f0; --surface: #f8fafc; --white: #ffffff;
    --blue: #2563eb; --green: #16a34a; --amber: #d97706; --red: #dc2626;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--surface);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding-top: 56px;
    min-height: 100vh;
  }

  /* ── Header ───────────────────────────────────────────────────────────────── */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--navy);
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-text {
    font-size: 1.1rem; font-weight: 800; color: #fff;
    letter-spacing: -0.03em; line-height: 1;
  }
  .header-badge {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(255,255,255,0.45); padding-top: 2px;
  }

  /* ── Main layout ──────────────────────────────────────────────────────────── */
  main { max-width: 720px; margin: 0 auto; padding: 36px 20px 80px; }

  /* ── Loading / error ──────────────────────────────────────────────────────── */
  .state-wrap { display: flex; justify-content: center; padding: 80px 20px; }
  .state-card {
    background: var(--white); border: 1px solid var(--line);
    padding: 48px 36px; text-align: center; max-width: 440px; width: 100%;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--line); border-top-color: var(--blue);
    border-radius: 50%; animation: spin 0.75s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-card p { font-size: 0.9rem; color: var(--slate); }
  .state-card .err-icon { margin-bottom: 16px; }
  .state-card .err-title { font-size: 1.05rem; font-weight: 700; color: var(--black); margin-bottom: 8px; }

  /* ── Exam identity card ───────────────────────────────────────────────────── */
  .exam-id-card {
    background: var(--white); border: 1px solid var(--line);
    border-top: 4px solid var(--navy);
    padding: 28px 32px; margin-bottom: 24px;
  }
  .exam-id-eyebrow {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .exam-id-title {
    font-size: 1.25rem; font-weight: 700; color: var(--black);
    letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 10px;
  }
  .exam-id-meta {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    font-size: 0.8rem; color: var(--muted);
  }
  .exam-id-name { font-weight: 600; color: var(--slate); font-size: 0.88rem; }
  .exam-id-sep { color: var(--line); }

  /* ── Score card ───────────────────────────────────────────────────────────── */
  .score-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 0; margin-bottom: 24px;
  }
  .score-cell {
    background: var(--white); border: 1px solid var(--line);
    padding: 24px 28px;
  }
  .score-cell:first-child { border-right: none; }
  .score-cell .sc-label {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
  }
  .score-cell .sc-value {
    font-size: 2.2rem; font-weight: 800; color: var(--black);
    line-height: 1; letter-spacing: -0.03em;
  }
  .score-cell .sc-sub { font-size: 0.78rem; color: var(--slate); margin-top: 6px; }
  .score-cell .sc-date { font-size: 0.95rem; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .score-cell .sc-group { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  /* ── Section bar ──────────────────────────────────────────────────────────── */
  .section-bar {
    background: var(--navy); padding: 10px 20px;
    border: 1px solid var(--navy); border-bottom: none;
  }
  .section-bar span {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.8);
  }

  /* ── Question tables ──────────────────────────────────────────────────────── */
  .q-table-wrap {
    background: var(--white); border: 1px solid var(--line);
    border-top: none; margin-bottom: 0;
    overflow-x: auto;
  }
  .q-table-wrap + .section-bar { margin-top: 20px; }
  .q-table-wrap:last-child { margin-bottom: 0; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 9px 16px;
    font-size: 0.58rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); text-align: left;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  tbody td {
    padding: 11px 16px; font-size: 0.82rem; color: var(--ink);
    border-bottom: 1px solid var(--line); vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) td { background: #fafbfd; }

  .td-q { width: 44%; font-size: 0.82rem; color: var(--ink); }
  .td-ans { width: 22%; }
  .td-correct { width: 22%; }
  .td-result { width: 12%; text-align: center; }
  .ans-correct { color: var(--ink); }
  .ans-wrong { color: var(--red); font-weight: 600; }
  .ans-none { color: var(--muted); font-style: italic; }
  .result-icon { font-size: 1.05rem; font-weight: 700; }
  .result-icon.ok { color: var(--green); }
  .result-icon.bad { color: var(--red); }

  /* open question cells */
  .open-label {
    font-size: 0.58rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 3px;
  }
  .open-response {
    font-size: 0.82rem; color: var(--slate);
    font-style: italic; white-space: pre-wrap; margin-bottom: 10px;
    line-height: 1.6;
  }
  .open-comment { font-size: 0.82rem; color: var(--ink); line-height: 1.6; }
  .open-score {
    font-size: 0.82rem; font-weight: 700; color: var(--slate);
    margin-top: 8px; display: inline-flex; align-items: center; gap: 4px;
  }
  .open-score-num { font-size: 1rem; font-weight: 800; color: var(--black); }

  /* bottom cap */
  .table-end { border: 1px solid var(--line); border-top: none; height: 0; margin-bottom: 24px; }
  .pool-note {
    border: 1px solid var(--line); border-top: none;
    background: var(--white); padding: 8px 16px;
    font-size: 0.72rem; color: var(--muted);
    margin-bottom: 24px;
  }

  /* ── Contact ──────────────────────────────────────────────────────────────── */
  .contact-card {
    background: var(--white); border: 1px solid var(--line);
    padding: 24px 28px; margin-top: 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .contact-card svg { flex-shrink: 0; color: var(--muted); }
  .contact-text { font-size: 0.82rem; color: var(--slate); }
  .contact-text strong { color: var(--ink); }
  .contact-text a { color: var(--blue); text-decoration: none; }

  /* ── Footer ───────────────────────────────────────────────────────────────── */
  footer {
    text-align: center; font-size: 0.72rem; color: var(--muted);
    padding: 24px 20px 40px;
  }

  @media (max-width: 540px) {
    main { padding: 24px 12px 60px; }
    header { padding: 0 20px; }
    .score-grid { grid-template-columns: 1fr; }
    .score-cell:first-child { border-right: 1px solid var(--line); border-bottom: none; }
    .exam-id-card { padding: 22px 20px; }
    .score-cell { padding: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <span class="logo-text">testflo</span>
  </div>
  <span class="header-badge">Résultats d'examen</span>
</header>

<main id="main">
  <div class="state-wrap">
    <div class="state-card">
      <div class="spinner"></div>
      <p id="loading-msg">Chargement de vos résultats…</p>
    </div>
  </div>
</main>

<footer id="footer" style="display:none;"></footer>

<script>
const SUPABASE_URL = 'https://toxgihdyfzdymgidgvaq.supabase.co';
const GET_RESULTS_FN = `${SUPABASE_URL}/functions/v1/get-results`;

const params = new URLSearchParams(window.location.search);
const attemptId = params.get('attempt');

function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function stripHtml(html) {
  return (html||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<\/li>/gi,'\n')
    .replace(/<li>/gi,'• ').replace(/<[^>]+>/g,'')
    .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
}

function showError(title, msg) {
  document.getElementById('main').innerHTML = `
    <div class="state-wrap">
      <div class="state-card">
        <div class="err-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <p class="err-title">${esc(title)}</p>
        <p>${esc(msg)}</p>
      </div>
    </div>`;
}

async function load() {
  if (!attemptId) { showError('Lien invalide', 'Aucun identifiant de résultats trouvé dans ce lien.'); return; }

  let data;
  try {
    const res = await fetch(`${GET_RESULTS_FN}?attempt=${encodeURIComponent(attemptId)}`);
    data = await res.json();
    if (!res.ok) {
      const msg = res.status === 410
        ? 'Ces résultats ne sont plus disponibles.'
        : (data.error || 'Impossible de charger les résultats.');
      showError('Résultats introuvables', msg);
      return;
    }
  } catch(e) {
    showError('Erreur réseau', 'Impossible de se connecter. Vérifiez votre connexion et réessayez.');
    return;
  }

  render(data);
}

function render(data) {
  const { attempt, exam, questions, teacher, score_max } = data;
  const lang = exam.lang === 'en' ? 'en' : 'fr';

  const T = lang === 'en' ? {
    headerBadge:   'Exam results',
    scoreLabel:    'Total Score', dateLabel: 'Date',
    submittedOn:   'Submitted on', groupLabel: 'Group',
    noAnswer:      'No answer', studentAns: 'Answer', correctAns: 'Correct answer', resultCol: 'Result',
    poolNote:      'Questions shown reflect those served to this student.',
    contactTitle:  'Questions about your results?',
    contactLine:   'Contact your instructor:',
    footerNote:    'This page was generated automatically by testflo.',
    openResp:      'Response', openComment: 'Teacher comment', openScore: 'Score',
    questionCol:   'Question',
  } : {
    headerBadge:   'Résultats d\'examen',
    scoreLabel:    'Score Total', dateLabel: 'Date',
    submittedOn:   'Soumis le', groupLabel: 'Groupe',
    noAnswer:      'Sans réponse', studentAns: 'Réponse', correctAns: 'Bonne réponse', resultCol: 'Résultat',
    poolNote:      'Les questions affichées correspondent à celles qui vous ont été présentées.',
    contactTitle:  'Des questions sur vos résultats ?',
    contactLine:   'Contactez votre enseignant :',
    footerNote:    'Cette page a été générée automatiquement par testflo.',
    openResp:      'Réponse', openComment: 'Commentaire de l\'enseignant', openScore: 'Note',
    questionCol:   'Question',
  };

  // Update header badge and page title
  document.querySelector('.header-badge').textContent = T.headerBadge;
  document.title = `testflo — ${exam.title}`;
  if (lang === 'en') document.documentElement.lang = 'en';

  const answersJson   = attempt.answers_json   || {};
  const openScores    = attempt.open_scores    || {};
  const openComments  = attempt.open_comments  || {};
  const poolSel       = attempt.pool_selection || {};
  const poolActive    = Object.keys(poolSel).length > 0;

  // Compute score
  const scoreMcq = attempt.score_mcq;
  let openTotal = 0, openCount = 0;
  Object.values(openScores).forEach(v => { openTotal += Number(v); openCount++; });
  const hasOpen = openCount > 0;
  const scoreObtained = scoreMcq != null ? (hasOpen ? scoreMcq + openTotal : scoreMcq) : null;
  const scoreDisplay  = scoreObtained != null ? scoreObtained : '—';
  const scoreMaxDisp  = score_max || exam.score_max || '—';
  const pct = scoreObtained != null && score_max > 0 ? Math.round((scoreObtained / score_max) * 100) : null;

  // Exam identity card
  const institution = exam.institution_name || '';
  let html = `
    <div class="exam-id-card">
      ${institution ? `<p class="exam-id-eyebrow">${esc(institution)}</p>` : ''}
      <h1 class="exam-id-title">${esc(exam.title)}</h1>
      <div class="exam-id-meta">
        <span class="exam-id-name">${esc(attempt.student_name)}</span>
        ${attempt.group_name ? `<span class="exam-id-sep">·</span><span>${esc(attempt.group_name)}</span>` : ''}
        <span class="exam-id-sep">·</span>
        <span>${T.submittedOn} ${fmtDate(attempt.submitted_at)}</span>
      </div>
    </div>`;

  // Score grid
  html += `
    <div class="score-grid">
      <div class="score-cell">
        <p class="sc-label">${T.scoreLabel}</p>
        <p class="sc-value">${scoreDisplay}<span style="font-size:1.2rem;font-weight:600;color:var(--muted);"> / ${scoreMaxDisp}</span></p>
        ${pct != null ? `<p class="sc-sub">${pct}%</p>` : ''}
      </div>
      <div class="score-cell">
        <p class="sc-label">${T.dateLabel}</p>
        <p class="sc-date">${fmtDate(attempt.submitted_at)}</p>
        ${attempt.group_name ? `<p class="sc-group">${esc(attempt.group_name)}</p>` : ''}
      </div>
    </div>`;

  // Q&A breakdown
  const hasSections = questions.some(q => q.type === 'section');
  let anyPoolActive = false;

  if (hasSections) {
    const groups = [];
    let cur = { title: '', sectionId: null, mcq: [], open: [] };
    let gIdx = 0;

    for (const q of questions) {
      if (q.type === 'section') {
        if (cur.mcq.length || cur.open.length || cur.title) groups.push(cur);
        cur = { title: stripHtml(q.question_text), sectionId: q.id, mcq: [], open: [] };
      } else {
        const drawn = (cur.sectionId && poolSel[cur.sectionId]) ? poolSel[cur.sectionId] : null;
        const include = drawn ? drawn.includes(gIdx) : true;
        if (!include) { gIdx++; continue; }
        if (drawn) anyPoolActive = true;

        const rawAns = answersJson['q' + gIdx];
        if (q.type === 'mcq') {
          const selIdx = (rawAns !== undefined && rawAns !== null) ? parseInt(rawAns, 10) : -1;
          const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
          const isCorrect = selIdx >= 0 && selIdx === q.correct_index;
          cur.mcq.push({
            q, idx: gIdx, selIdx,
            studentText: selIdx >= 0 ? (stripHtml(opts[selIdx]) || '—') : null,
            correctText: q.correct_index >= 0 ? (stripHtml(opts[q.correct_index]) || '—') : '—',
            isCorrect,
          });
        } else if (q.type === 'open') {
          cur.open.push({
            q, idx: gIdx,
            response: stripHtml(typeof rawAns === 'string' ? rawAns : ''),
            score:    openScores[gIdx] != null ? openScores[gIdx] : null,
            comment:  openComments[gIdx] || '',
          });
        }
        gIdx++;
      }
    }
    if (cur.mcq.length || cur.open.length || cur.title) groups.push(cur);

    for (const g of groups) {
      if (!g.mcq.length && !g.open.length) continue;

      html += `<div class="section-bar"><span>${esc(g.title || '')}</span></div>`;

      if (g.mcq.length) {
        html += `<div class="q-table-wrap"><table>
          <thead><tr>
            <th class="td-q">${T.questionCol}</th>
            <th class="td-ans">${T.studentAns}</th>
            <th class="td-correct">${T.correctAns}</th>
            <th class="td-result">${T.resultCol}</th>
          </tr></thead><tbody>`;
        for (const r of g.mcq) {
          const ansCls = r.studentText ? (r.isCorrect ? 'ans-correct' : 'ans-wrong') : 'ans-none';
          const ansText = r.studentText ? esc(r.studentText) : `<em>${T.noAnswer}</em>`;
          html += `<tr>
            <td class="td-q">${esc(stripHtml(r.q.question_text))}</td>
            <td class="td-ans"><span class="${ansCls}">${ansText}</span></td>
            <td class="td-correct">${esc(r.correctText)}</td>
            <td class="td-result"><span class="result-icon ${r.isCorrect ? 'ok' : 'bad'}">${r.isCorrect ? '✓' : '✗'}</span></td>
          </tr>`;
        }
        html += `</tbody></table></div>`;
      }

      const gradedOpen = g.open.filter(r => r.response || r.comment || r.score != null);
      if (gradedOpen.length) {
        html += `<div class="q-table-wrap" style="${g.mcq.length ? 'border-top:1px solid var(--line);' : ''}"><table>
          <thead><tr>
            <th class="td-q" style="width:44%;">${T.questionCol}</th>
            <th>${T.openResp} · ${T.openComment} · ${T.openScore}</th>
          </tr></thead><tbody>`;
        for (const r of gradedOpen) {
          const respHtml = r.response ? `<p class="open-label">${T.openResp}</p><p class="open-response">${esc(r.response)}</p>` : '';
          const cmtHtml  = r.comment  ? `<p class="open-label">${T.openComment}</p><p class="open-comment">${esc(r.comment)}</p>` : '';
          const scHtml   = r.score != null
            ? `<p class="open-score"><span class="open-score-num">${r.score}</span> / ${r.q.max_points ?? '?'}</p>`
            : '';
          html += `<tr>
            <td class="td-q" style="font-weight:600;">${esc(stripHtml(r.q.question_text))}</td>
            <td>${respHtml}${cmtHtml}${scHtml}</td>
          </tr>`;
        }
        html += `</tbody></table></div>`;
      }
    }

  } else {
    // Flat list, no sections
    const mcqRows = [], openRows = [];
    let gIdx = 0;
    for (const q of questions) {
      if (q.type === 'section') continue;
      const rawAns = answersJson['q' + gIdx];
      if (q.type === 'mcq') {
        const selIdx = (rawAns !== undefined && rawAns !== null) ? parseInt(rawAns, 10) : -1;
        const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
        mcqRows.push({
          q, idx: gIdx, selIdx,
          studentText: selIdx >= 0 ? (stripHtml(opts[selIdx]) || '—') : null,
          correctText: q.correct_index >= 0 ? (stripHtml(opts[q.correct_index]) || '—') : '—',
          isCorrect: selIdx >= 0 && selIdx === q.correct_index,
        });
      } else if (q.type === 'open') {
        openRows.push({
          q, idx: gIdx,
          response: stripHtml(typeof rawAns === 'string' ? rawAns : ''),
          score: openScores[gIdx] != null ? openScores[gIdx] : null,
          comment: openComments[gIdx] || '',
        });
      }
      gIdx++;
    }

    if (mcqRows.length) {
      html += `<div class="section-bar"><span>${lang === 'en' ? 'Multiple choice' : 'Questions à choix multiple'}</span></div>
        <div class="q-table-wrap"><table>
          <thead><tr>
            <th class="td-q">${T.questionCol}</th>
            <th class="td-ans">${T.studentAns}</th>
            <th class="td-correct">${T.correctAns}</th>
            <th class="td-result">${T.resultCol}</th>
          </tr></thead><tbody>`;
      for (const r of mcqRows) {
        const ansCls = r.studentText ? (r.isCorrect ? 'ans-correct' : 'ans-wrong') : 'ans-none';
        const ansText = r.studentText ? esc(r.studentText) : `<em>${T.noAnswer}</em>`;
        html += `<tr>
          <td class="td-q">${esc(stripHtml(r.q.question_text))}</td>
          <td class="td-ans"><span class="${ansCls}">${ansText}</span></td>
          <td class="td-correct">${esc(r.correctText)}</td>
          <td class="td-result"><span class="result-icon ${r.isCorrect ? 'ok' : 'bad'}">${r.isCorrect ? '✓' : '✗'}</span></td>
        </tr>`;
      }
      html += `</tbody></table></div>`;
    }

    const gradedOpen = openRows.filter(r => r.response || r.comment || r.score != null);
    if (gradedOpen.length) {
      html += `<div class="section-bar" style="margin-top:20px;"><span>${lang === 'en' ? 'Written questions' : 'Questions rédigées'}</span></div>
        <div class="q-table-wrap"><table>
          <thead><tr>
            <th class="td-q" style="width:44%;">${T.questionCol}</th>
            <th>${T.openResp} · ${T.openComment} · ${T.openScore}</th>
          </tr></thead><tbody>`;
      for (const r of gradedOpen) {
        const respHtml = r.response ? `<p class="open-label">${T.openResp}</p><p class="open-response">${esc(r.response)}</p>` : '';
        const cmtHtml  = r.comment  ? `<p class="open-label">${T.openComment}</p><p class="open-comment">${esc(r.comment)}</p>` : '';
        const scHtml   = r.score != null
          ? `<p class="open-score"><span class="open-score-num">${r.score}</span> / ${r.q.max_points ?? '?'}</p>`
          : '';
        html += `<tr>
          <td class="td-q" style="font-weight:600;">${esc(stripHtml(r.q.question_text))}</td>
          <td>${respHtml}${cmtHtml}${scHtml}</td>
        </tr>`;
      }
      html += `</tbody></table></div>`;
    }
  }

  // Bottom border cap
  html += `<div class="table-end"></div>`;

  if (anyPoolActive || poolActive) {
    html = html.replace('<div class="table-end"></div>', `<p class="pool-note">${T.poolNote}</p>`);
  }

  // Contact block
  if (teacher.name || teacher.email) {
    html += `<div class="contact-card">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <div class="contact-text">
        <p>${T.contactTitle}</p>
        <p>
          ${teacher.name ? `<strong>${esc(teacher.name)}</strong>` : ''}
          ${teacher.name && teacher.email ? ' — ' : ''}
          ${teacher.email ? `<a href="mailto:${esc(teacher.email)}">${esc(teacher.email)}</a>` : ''}
        </p>
      </div>
    </div>`;
  }

  document.getElementById('main').innerHTML = html;
  const footer = document.getElementById('footer');
  footer.textContent = T.footerNote;
  footer.style.display = 'block';
}

load();
</script>
</body>
</html>
