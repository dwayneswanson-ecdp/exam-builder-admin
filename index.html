<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>testflo — Importer un examen</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Forward password recovery links to dashboard.html
    const _h = Object.fromEntries(new URLSearchParams(window.location.hash.slice(1)));
    if (_h.type === 'recovery' && _h.access_token) {
      window.location.replace('dashboard.html' + window.location.hash);
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black:   #0a0a0a;
      --navy:    #0f172a;
      --ink:     #1e293b;
      --slate:   #475569;
      --muted:   #94a3b8;
      --line:    #e2e8f0;
      --surface: #f8fafc;
      --white:   #ffffff;
      --blue:    #2563eb;
      --green:   #16a34a;
      --amber:   #d97706;
      --red:     #dc2626;
      --purple:  #7c3aed;
      --transition: 180ms ease;
    }
    body { font-family: 'Inter', sans-serif; background: var(--white); color: var(--ink); margin: 0; padding: 0; font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

    /* ── Header ── */
    .site-header { background: var(--navy); padding: 0 40px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .site-header-left { display: flex; align-items: center; gap: 16px; }
    .site-back-btn { display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.5); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: none; cursor: pointer; font-family: inherit; transition: color var(--transition); }
    .site-back-btn:hover { color: #fff; }
    .site-logo img { height: 26px; width: auto; }
    .site-hdivider { width: 1px; height: 18px; background: rgba(255,255,255,0.1); }
    .site-badge { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.15); padding: 2px 8px; }
    .site-username { font-size: 0.78rem; font-weight: 600; color: rgba(255,255,255,0.6); }
    .site-header-right { display: flex; align-items: center; gap: 16px; }
    .user-menu { position: relative; display: flex; align-items: center; }
    .user-menu-btn { display: flex; align-items: center; gap: 7px; background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.6); font-size: 0.78rem; font-weight: 600; font-family: inherit; padding: 5px 8px; transition: color var(--transition); }
    .user-menu-btn:hover { color: rgba(255,255,255,0.9); }
    .user-menu-btn .um-caret { transition: transform var(--transition); }
    .user-menu-btn.open .um-caret { transform: rotate(180deg); }
    .user-dropdown { display: none; position: absolute; right: 0; top: calc(100% + 6px); background: var(--navy); border: 1px solid rgba(255,255,255,0.08); min-width: 160px; z-index: 500; box-shadow: 0 8px 28px rgba(0,0,0,0.35); }
    .user-dropdown.open { display: block; }
    .user-dropdown-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; background: transparent; border: none; color: rgba(255,255,255,0.6); font-size: 0.82rem; font-weight: 500; font-family: inherit; cursor: pointer; text-align: left; transition: all var(--transition); white-space: nowrap; }
    .user-dropdown-item:hover { background: rgba(255,255,255,0.06); color: #fff; }

    /* ── AI chip ── */
    .ai-chip { display: inline-flex; align-items: center; justify-content: center; background: var(--purple); color: #fff; font-size: 0.58rem; font-weight: 800; letter-spacing: 0.06em; width: 20px; height: 20px; border-radius: 50%; vertical-align: middle; flex-shrink: 0; }

    /* ── Exam summary banner ── */
    .exam-summary { background: var(--white); border: 1px solid var(--line); padding: 14px 24px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .exam-summary-title { font-size: 0.9rem; font-weight: 700; color: var(--black); margin-bottom: 3px; }
    .exam-summary-meta { font-size: 0.72rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
    .exam-summary-edit { font-size: 0.72rem; font-weight: 700; color: var(--blue); text-decoration: none; white-space: nowrap; flex-shrink: 0; cursor: pointer; background: none; border: none; font-family: inherit; }
    .exam-summary-edit:hover { text-decoration: underline; }

    /* ── Step AI purple — handled by .step-item.active-ai/.done-ai above ── */

    /* ── Grading criteria ── */
    .criteria-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #a78bfa; margin: 12px 0 6px; display: flex; align-items: center; gap: 6px; }
    .criteria-textarea { width: 100%; font-size: 0.8rem; font-family: inherit; border: 1.5px solid #e9d5ff; padding: 9px 12px; color: #4c1d95; outline: none; resize: vertical; min-height: 56px; background: #faf5ff; line-height: 1.6; }
    .criteria-textarea::placeholder { color: #c4b5fd; font-style: italic; }
    .criteria-textarea:focus { border-color: var(--purple); }
    .criteria-pts-row { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 6px; }
    .criteria-pts-label { font-size: 0.72rem; color: var(--muted); }
    .criteria-pts-input { width: 52px; text-align: center; font-weight: 700; font-size: 0.9rem; border: 1.5px solid #e9d5ff; padding: 4px; font-family: inherit; color: #4c1d95; background: #faf5ff; outline: none; }
    .criteria-pts-input:focus { border-color: var(--purple); }

    /* ── Layout ── */
    .container { max-width: 720px; margin: 0 auto; padding: 32px 40px 100px; }

    /* ── Lang toggle ── */
    .topbar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 28px; gap: 16px; }
    .lang-toggle { display: flex; border: 1px solid var(--line); overflow: hidden; font-size: 0.8rem; font-weight: 700; }
    .lang-btn { padding: 5px 14px; cursor: pointer; border: none; background: transparent; font-family: inherit; font-size: 0.78rem; font-weight: 700; color: var(--muted); transition: all var(--transition); }
    .lang-btn.active { background: var(--navy); color: #fff; }

    /* ── Step track — exact replica of exam-onboarding.html ── */
    .step-track { display: flex; align-items: center; margin-bottom: 40px; padding-bottom: 32px; border-bottom: 1px solid var(--line); }
    .step-item { display: flex; align-items: center; gap: 10px; }
    .step-num { width: 26px; height: 26px; border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 800; letter-spacing: 0.04em; color: var(--muted); flex-shrink: 0; transition: all var(--transition); }
    .step-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; transition: color var(--transition); }
    .step-item.active .step-num { background: var(--black); border-color: var(--black); color: var(--white); }
    .step-item.active .step-label { color: var(--black); }
    .step-item.done .step-num { background: var(--green); border-color: var(--green); color: var(--white); }
    .step-item.done .step-label { color: var(--green); }
    .step-item.active-ai .step-num { background: var(--purple); border-color: var(--purple); color: var(--white); }
    .step-item.active-ai .step-label { color: var(--purple); }
    .step-item.done-ai .step-num { background: var(--purple); border-color: var(--purple); color: var(--white); }
    .step-item.done-ai .step-label { color: var(--purple); }
    .step-connector { flex: 1; height: 1px; background: var(--line); margin: 0 16px; min-width: 24px; transition: background var(--transition); }
    .step-connector.done { background: var(--green); }

    /* ── Cards ── */
    .card { background: var(--white); border: 1px solid var(--line); padding: 32px 40px; margin-bottom: 20px; }
    .card h2 { font-size: 1rem; font-weight: 700; color: var(--black); margin: 0 0 6px 0; }
    .card-sub { font-size: 0.85rem; color: var(--slate); margin: 0 0 24px 0; }

    /* ── Upload card title area ── */
    .card-eyebrow { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--purple); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .card-title { font-size: 1.3rem; font-weight: 700; color: var(--black); letter-spacing: -0.02em; margin-bottom: 24px; }

    /* ── Drop zone ── */
    .upload-zone { border: 2px dashed var(--line); padding: 52px 20px; text-align: center; cursor: pointer; transition: all var(--transition); background: var(--surface); position: relative; }
    .upload-zone:hover, .upload-zone.dragover { border-color: var(--blue); background: #eff6ff; }
    .upload-zone.has-file { border-color: var(--green); background: #f0fdf4; border-style: solid; }
    .zone-icon { font-size: 32px; margin-bottom: 16px; display: block; color: var(--muted); }
    .zone-label { font-size: 0.95rem; font-weight: 700; color: var(--black); margin-bottom: 6px; }
    .zone-sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
    .zone-btn { display: inline-block; background: var(--blue); color: #fff; padding: 10px 24px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; border: none; font-family: inherit; transition: background var(--transition); }
    .zone-btn:hover { background: #1d4ed8; }

    /* ── File pill ── */
    .file-pill { display: none; align-items: center; gap: 8px; background: #f0fdf4; border: 1px solid #86efac; padding: 10px 14px; margin-top: 12px; }
    .file-pill.visible { display: flex; }
    .pill-name { font-size: 0.82rem; font-weight: 600; color: var(--black); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill-size { font-size: 0.75rem; color: var(--slate); white-space: nowrap; }
    .pill-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0; flex-shrink: 0; }
    .pill-remove:hover { color: var(--red); }

    .instructions-col { display: flex; flex-direction: column; gap: 10px; }

    /* ── Format example (doc mockup) ── */
    .doc-wrap { background: #d0d0d0; padding: 10px 10px 8px; margin-top: 4px; }
    .doc-wrap-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5a5a5a; margin-bottom: 8px; font-family: 'Inter', sans-serif; }
    .doc-page { background: #fff; box-shadow: 2px 2px 6px rgba(0,0,0,0.2); padding: 16px 24px; font-family: 'Times New Roman', Times, serif; font-size: 0.88rem; color: #111; display: flex; gap: 40px; }
    .doc-col { flex: 1; line-height: 1.75; }
    .doc-page .doc-q { font-weight: 700; display: block; margin-bottom: 2px; }
    .doc-page .doc-opt { display: block; padding-left: 14px; }
    .doc-page .doc-correct { font-weight: 700; }
    .doc-page .doc-star { color: var(--red); font-weight: 900; }
    .doc-page .doc-written-label { display: inline-block; background: #ede9fe; color: #6d28d9; font-size: 0.7rem; font-weight: 700; padding: 1px 7px; font-family: 'Inter', sans-serif; margin-left: 6px; vertical-align: middle; }
    .doc-footer { margin-top: 8px; font-size: 0.72rem; color: #5a5a5a; font-family: 'Inter', sans-serif; line-height: 1.5; text-align: center; }
    .legend { display: flex; gap: 20px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; color: var(--slate); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .legend-dot.red { background: var(--red); }
    .legend-dot.purple { background: var(--purple); }

    /* ── Upload instruction block ── */
    .upload-instruction-block { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
    .upload-instruction { font-size: 0.82rem; color: var(--slate); line-height: 1.7; margin-bottom: 16px; }
    .upload-hint { font-size: 0.75rem; color: var(--muted); margin-top: 14px; line-height: 1.6; font-style: italic; }

    /* ── Alert ── */
    .alert { display: none; padding: 12px 16px; font-size: 0.82rem; font-weight: 600; margin-top: 14px; margin-bottom: 14px; border-left: 3px solid; }
    .alert.visible { display: block; }
    .alert.error { background: #fee2e2; color: #991b1b; border-color: var(--red); }
    .alert.warning { background: #fffbeb; color: #92400e; border-color: var(--amber); }

    /* ── Extract button ── */
    .extract-btn { width: 100%; background: var(--blue); color: #fff; border: none; padding: 15px; font-size: 0.88rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-family: inherit; cursor: pointer; margin-top: 16px; transition: background var(--transition); display: none; }
    .extract-btn.visible { display: block; }
    .extract-btn:hover { background: #1d4ed8; }
    .extract-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Progress ── */
    .progress-wrap { display: none; margin-top: 16px; }
    .progress-wrap.visible { display: block; }
    .progress-label { font-size: 0.82rem; color: var(--slate); font-weight: 600; margin-bottom: 8px; }
    .progress-bar-bg { background: var(--line); height: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--blue); transition: width 0.4s ease; width: 0%; }

    /* ── Results ── */
    .results-card { display: none; }
    .results-card.visible { display: block; }
    .success-msg { display: flex; align-items: center; gap: 12px; background: #f0fdf4; border: 1px solid #86efac; padding: 14px 18px; font-size: 0.88rem; font-weight: 600; color: #166534; margin-bottom: 12px; }

    /* ── AI spinner ── */
    .ai-spinner { display: flex; align-items: center; gap: 14px; padding: 24px 0; }
    .spinner { width: 24px; height: 24px; border: 3px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── AI stats ── */
    .ai-stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; }
    .stat-label { font-size: 0.65rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .stat-value { font-size: 1.3rem; font-weight: 800; color: var(--black); letter-spacing: -0.02em; }
    .stat-value.green { color: var(--green); }
    .stat-value.purple { color: var(--purple); }

    /* ── Question list ── */
    .q-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; max-height: 420px; overflow-y: auto; }
    .q-item { border: 1px solid var(--line); padding: 14px 16px; background: var(--white); }
    .q-item.open-q { border-color: #c4b5fd; background: #faf5ff; }
    .q-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .q-num { font-size: 0.75rem; font-weight: 700; color: var(--muted); }
    .q-type-badge { font-size: 0.65rem; font-weight: 700; padding: 2px 8px; text-transform: uppercase; letter-spacing: 0.06em; }
    .q-type-badge.mcq { background: #dbeafe; color: #1d4ed8; }
    .q-type-badge.open { background: #ede9fe; color: var(--purple); }
    .q-text { font-size: 0.88rem; font-weight: 600; color: var(--black); margin-bottom: 8px; line-height: 1.4; }
    .q-options { display: flex; flex-direction: column; gap: 4px; }
    .q-option { font-size: 0.82rem; color: var(--slate); padding: 4px 10px; display: flex; align-items: center; gap: 6px; }
    .q-option.correct { background: #dcfce7; color: #166534; font-weight: 700; }
    .q-option-letter { font-weight: 700; min-width: 18px; }
    .q-open-hint { font-size: 0.82rem; color: var(--purple); font-style: italic; }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }

    .section-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }
    .text-preview { background: var(--surface); border: 1px solid var(--line); padding: 16px; font-size: 0.82rem; color: #374151; line-height: 1.7; max-height: 240px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; margin-bottom: 20px; }

    .next-btn { width: 100%; background: var(--blue); color: #fff; border: none; padding: 15px; font-size: 0.88rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-family: inherit; cursor: pointer; transition: background var(--transition); }
    .next-btn:hover { background: #1d4ed8; }

    /* ── Review interface ── */
    .exam-meta { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .meta-field { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .meta-field-sm { flex: 0 0 160px; }
    .meta-label { font-size: 0.72rem; font-weight: 700; color: var(--slate); text-transform: uppercase; letter-spacing: 0.06em; }
    .meta-input { padding: 10px 14px; border: 1px solid var(--line); font-size: 0.9rem; font-family: inherit; color: var(--black); outline: none; width: 100%; transition: border-color var(--transition); }
    .meta-input:focus { border-color: var(--blue); }
    .meta-duration { display: flex; align-items: center; gap: 8px; }
    .meta-unit { font-size: 0.85rem; color: var(--slate); white-space: nowrap; }

    .review-stats { font-size: 0.85rem; color: var(--slate); margin-bottom: 16px; font-weight: 500; }
    .review-stats .rs-mcq { color: var(--green); font-weight: 700; }
    .review-stats .rs-open { color: var(--purple); font-weight: 700; }
    .review-stats .rs-total { color: var(--black); font-weight: 700; }

    /* ── Question cards (review) ── */
    #reviewList { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

    .rq-section { border: 2px solid var(--ink); overflow: hidden; margin-bottom: 8px; }
    .rq-section-head { background: var(--navy); padding: 11px 16px; display: flex; align-items: center; gap: 10px; }
    .rq-section-lbl { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.35); flex-shrink: 0; }
    .rq-section-title { flex: 1; background: transparent; border: none; outline: none; font-size: 0.9rem; font-weight: 700; color: #fff; font-family: inherit; }
    .rq-section-title::placeholder { color: rgba(255,255,255,0.25); }
    .rq-section-acts { display: flex; gap: 2px; }
    .rq-section-btn { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.3); padding: 5px; display: flex; align-items: center; transition: color var(--transition); }
    .rq-section-btn:hover { color: #fff; }
    .rq-section-btn.del:hover { color: #fca5a5; }
    .rq-section-body { background: var(--surface); border-top: 1px solid var(--ink); padding: 9px 16px; display: flex; align-items: center; gap: 12px; }
    .rq-section-instr { flex: 1; background: transparent; border: none; outline: none; font-size: 0.78rem; color: var(--slate); font-family: inherit; }
    .rq-section-instr::placeholder { color: var(--line); font-style: italic; }
    .rq-section-auto { font-size: 0.65rem; font-weight: 700; background: #eff6ff; color: var(--blue); border: 1px solid #bfdbfe; padding: 2px 7px; flex-shrink: 0; }

    .rq-card { border: 1.5px solid var(--line); overflow: hidden; background: var(--white); transition: border-color var(--transition); }
    .rq-card:hover { border-color: #cbd5e1; }
    .rq-card.open-type { border-color: #c4b5fd; }
    .rq-card.inferred { border-color: #fde68a; }

    .rq-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .rq-card.open-type .rq-header { background: #faf5ff; border-color: #e9d5ff; }
    .rq-card.inferred .rq-header { background: #fffbeb; border-color: #fde68a; }

    .rq-num { font-size: 0.75rem; font-weight: 700; color: var(--muted); min-width: 28px; }
    .rq-badge { font-size: 0.65rem; font-weight: 700; padding: 2px 8px; text-transform: uppercase; letter-spacing: 0.06em; }
    .rq-badge.mcq { background: #dbeafe; color: #1d4ed8; }
    .rq-badge.open { background: #ede9fe; color: var(--purple); }
    .rq-inferred { font-size: 0.72rem; color: var(--amber); font-weight: 600; }

    .rq-type-toggle { margin-left: 4px; font-size: 0.72rem; font-weight: 600; color: var(--slate); background: none; border: 1px solid var(--line); padding: 2px 8px; cursor: pointer; font-family: inherit; transition: all var(--transition); }
    .rq-type-toggle:hover { background: var(--surface); color: var(--black); }

    .rq-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .rq-pts-wrap { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); padding: 3px 8px; }
    .rq-pts-input { width: 36px; border: none; background: transparent; font-size: 0.82rem; font-weight: 700; color: var(--black); font-family: inherit; text-align: center; outline: none; padding: 0; }
    .rq-pts-input::-webkit-inner-spin-button, .rq-pts-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .rq-pts-label { font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .rq-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 4px 6px; color: var(--muted); transition: all var(--transition); font-family: inherit; }
    .rq-btn:hover { background: var(--surface); color: var(--black); }
    .rq-btn.delete:hover { background: #fee2e2; color: var(--red); }

    .rq-body { padding: 14px; }

    .rq-q-input { width: 100%; border: 1px solid var(--line); padding: 10px 12px; font-size: 0.88rem; font-family: inherit; color: var(--black); resize: vertical; min-height: 60px; outline: none; margin-bottom: 12px; transition: border-color var(--transition); line-height: 1.5; }
    .rq-q-input:focus { border-color: var(--blue); }

    .rq-options { display: flex; flex-direction: column; gap: 6px; }
    .rq-cb { width: 18px; height: 18px; border: 1.5px solid var(--line); background: var(--white); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all var(--transition); overflow: visible; }
    .rq-cb-checked { background: var(--green); border-color: var(--green); }
    .rq-correct-badge { font-size: 11px; font-weight: 600; color: #166534; white-space: nowrap; padding: 3px 10px; background: #dcfce7; margin-left: auto; flex-shrink: 0; display: inline-flex; align-items: center; }
    .rq-option-row { display: flex; align-items: center; gap: 8px; }
    .rq-opt-letter { font-size: 0.78rem; font-weight: 800; color: var(--muted); min-width: 20px; text-align: center; }
    .rq-opt-input { flex: 1; border: 1px solid var(--line); padding: 6px 10px; font-size: 0.84rem; font-family: inherit; color: var(--black); outline: none; transition: border-color var(--transition); min-width: 0; }
    .rq-opt-input:focus { border-color: var(--blue); }
    .rq-correct-check { font-size: 0.85rem; font-weight: 800; color: var(--green); padding: 0 8px; flex-shrink: 0; }
    .rq-option-row { cursor: pointer; transition: background var(--transition); }
    .rq-option-row:hover:not(.correct-row) { background: #f0fdf4; }
    .rq-option-row.correct-row { background: #f0fdf4; border: 1px solid #86efac !important; padding: 6px 10px; }
    .rq-option-row.correct-row .rq-opt-input { border-color: transparent; background: #f0fdf4; color: #166534; }
    .rq-option-row.correct-row .rq-opt-letter { color: var(--green); }

    .rq-open-note { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #ede9fe; font-size: 0.82rem; color: var(--purple); font-weight: 600; }

    .drag-instructions { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--muted); font-weight: 500; margin-bottom: 10px; padding: 8px 12px; background: var(--surface); border: 1px dashed var(--line); }

    .rq-card.drag-over { border-color: var(--blue); box-shadow: 0 -3px 0 0 var(--blue); }
    .rq-card.drag-over::before { content: ''; display: block; height: 3px; background: repeating-linear-gradient(90deg, var(--blue) 0px, var(--blue) 8px, transparent 8px, transparent 14px); margin: -1px -1px 0; }

    .media-attached-banner { display: none; align-items: center; justify-content: space-between; gap: 10px; background: #f0fdf4; border: 1px solid #86efac; padding: 8px 14px; margin-bottom: 12px; font-size: 0.82rem; font-weight: 600; color: #166534; flex-wrap: wrap; }
    .drag-handle { cursor: grab; padding: 4px; color: var(--muted); display: flex; align-items: center; }
    .drag-handle:active { cursor: grabbing; }
    .rq-card.dragging { opacity: 0.4; }
    .rq-card.drag-over { border-color: var(--blue); box-shadow: 0 0 0 2px #bfdbfe; }

    .rq-card.editing { border-color: var(--blue); box-shadow: 0 0 0 3px #dbeafe; }
    .rq-card.editing .rq-header { background: #eff6ff; border-bottom-color: #bfdbfe; }

    .rq-btn.delete { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 600; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; }
    .rq-btn.delete:hover { background: #fee2e2; border-color: #fca5a5; color: var(--red); }

    .undo-toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 20px; display: none; align-items: center; gap: 16px; font-size: 0.88rem; font-weight: 500; z-index: 9999; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .undo-toast.visible { display: flex; }
    .undo-toast button { background: var(--blue); border: none; color: #fff; padding: 5px 14px; font-size: 0.82rem; font-weight: 700; cursor: pointer; font-family: inherit; }
    .undo-toast button:hover { background: #1d4ed8; }

    .meta-extra { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .meta-extra-field { flex: 1; min-width: 220px; }
    .exam-lang-toggle { display: flex; gap: 6px; margin-top: 4px; }
    .exam-lang-btn { padding: 7px 16px; border: 2px solid var(--line); background: var(--surface); color: var(--slate); font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: all var(--transition); }
    .exam-lang-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .meta-hint { font-size: 0.72rem; color: var(--muted); margin-top: 5px; line-height: 1.5; }

    .no-star-hint { font-size: 0.78rem; color: var(--slate); background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; margin-top: 10px; line-height: 1.5; }

    .review-instructions-box { font-size: 0.82rem; color: var(--slate); background: var(--surface); border: 1px solid var(--line); padding: 12px 16px; margin-bottom: 20px; line-height: 1.7; }

    .card.step-collapsed { padding: 14px 24px; cursor: pointer; }
    .card.step-collapsed > *:not(.step-done-bar) { display: none !important; }
    .step-done-bar { display: none; align-items: center; gap: 10px; font-size: 0.85rem; font-weight: 600; color: var(--green); }
    .card.step-collapsed .step-done-bar { display: flex; }
    .card.step-collapsed:hover { border-color: var(--blue); }

    .rq-media-toggle { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; font-size: 0.8rem; font-weight: 600; color: var(--slate); background: none; border-left: none; border-right: none; border-bottom: none; width: 100%; text-align: left; font-family: inherit; transition: color var(--transition); }
    .rq-media-toggle:hover { color: var(--blue); }
    .rq-media-toggle.has-media { color: var(--blue); border-top-color: #bfdbfe; background: #f0f9ff; }

    .rq-media-panel { display: none; padding: 14px; border-top: 1px solid var(--line); background: var(--surface); }
    .rq-media-panel.open { display: block; }

    .media-type-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .media-tab { padding: 5px 12px; border: 1.5px solid var(--line); background: var(--white); font-size: 0.78rem; font-weight: 700; color: var(--slate); cursor: pointer; font-family: inherit; transition: all var(--transition); }
    .media-tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }

    .media-upload-area { border: 2px dashed var(--line); padding: 16px; text-align: center; cursor: pointer; transition: all var(--transition); }
    .media-upload-area:hover { border-color: var(--blue); background: #eff6ff; }
    .media-upload-area.has-file { border-color: var(--green); background: #f0fdf4; border-style: solid; }
    .media-upload-label { font-size: 0.8rem; color: var(--slate); font-weight: 500; }
    .media-upload-label strong { color: var(--black); }

    .media-url-input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); font-size: 0.84rem; font-family: inherit; color: var(--black); outline: none; transition: border-color var(--transition); }
    .media-url-input:focus { border-color: var(--blue); }

    .media-preview { margin-top: 12px; overflow: hidden; }
    .media-preview img { max-width: 100%; max-height: 200px; display: block; }
    .media-preview audio { width: 100%; }
    .media-preview iframe { width: 100%; height: 200px; border: none; }
    .media-preview-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    .media-remove { margin-top: 8px; font-size: 0.78rem; color: var(--red); background: none; border: none; cursor: pointer; font-family: inherit; font-weight: 600; padding: 0; }
    .media-remove:hover { text-decoration: underline; }

    .add-q-btn { width: 100%; padding: 12px; border: 2px dashed var(--line); background: transparent; color: var(--slate); font-size: 0.85rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all var(--transition); margin-bottom: 16px; }
    .add-q-btn:hover { border-color: var(--blue); color: var(--blue); background: #eff6ff; }

    .publish-btn { width: 100%; background: var(--blue); color: #fff; border: none; padding: 16px; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-family: inherit; cursor: pointer; transition: background var(--transition); }
    .publish-btn:hover { background: #1d4ed8; }

    @media (max-width: 640px) {
      .site-header { padding: 0 20px; }
      .container { padding: 0 20px 80px; }
      .card { padding: 24px 20px; }
      .steps { flex-wrap: wrap; }
      .step { font-size: 0.62rem; padding: 0 10px; height: 38px; }
    }
  </style>
</head>
<body>

  <!-- Standard header -->
  <header class="site-header">
    <div class="site-header-left">
      <button class="site-back-btn" onclick="window.location.href='dashboard.html'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Dashboard
      </button>
      <div class="site-hdivider"></div>
      <div class="site-logo"><img src="testflo-dark.svg" alt="testflo"></div>
      <div class="site-hdivider"></div>
      <span class="site-badge">Teacher</span>
    </div>
    <div class="site-header-right">
      <div id="langToggleMount"></div>
      <div class="user-menu" id="userMenu">
        <button class="user-menu-btn" id="userMenuBtn" onclick="toggleUserMenu()">
          <span id="siteUsername"></span>
          <svg class="um-caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="user-dropdown" id="userDropdown">
          <button class="user-dropdown-item" onclick="signOutUser()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Page title block — kept for JS compatibility -->
  <div id="pageTitleBlock" style="display:none;"></div>

  <div class="container">

  <!-- Step track — exact replica of exam-onboarding.html -->
  <div class="step-track">
    <div class="step-item done">
      <div class="step-num">✓</div>
      <span class="step-label">Configure</span>
    </div>
    <div class="step-connector done"></div>
    <div class="step-item active" id="step1">
      <div class="step-num">1</div>
      <span class="step-label" data-i18n="step1"></span>
    </div>
    <div class="step-connector" id="sc1"></div>
    <div class="step-item" id="step2">
      <div class="step-num">2</div>
      <span class="step-label" data-i18n="step2"></span>
    </div>
    <div class="step-connector" id="sc2"></div>
    <div class="step-item" id="step3">
      <div class="step-num">3</div>
      <span class="step-label" data-i18n="step3"></span>
    </div>
    <div class="step-connector" id="sc3"></div>
    <div class="step-item" id="step4">
      <div class="step-num">4</div>
      <span class="step-label" data-i18n="step4"></span>
    </div>
  </div>

  <!-- Exam summary banner — inside container, aligned with content -->
  <div class="exam-summary" id="examSummaryBanner" style="display:none;">
    <div>
      <div class="exam-summary-title" id="summaryTitle">—</div>
      <div class="exam-summary-meta" id="summaryMeta"></div>
    </div>
    <button class="exam-summary-edit" onclick="window.location.href='exam-onboarding.html'">Edit details →</button>
  </div>

  <!-- Upload card -->
  <div class="card" id="uploadCard">
    <div class="step-done-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"/></svg>
      <span id="uploadDoneLabel"></span>
    </div>

    <!-- Eyebrow + title -->
    <div class="card-eyebrow">
      <span class="ai-chip" style="width:16px;height:16px;font-size:0.52rem;">AI</span>
      <span data-i18n="step1"></span>
    </div>
    <h2 class="card-title" data-i18n="cardTitle"></h2>

    <!-- Primary: upload zone -->
    <div class="upload-zone" id="examZone">
      <span class="zone-icon" id="zoneIcon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
      <div class="zone-label" data-i18n="zoneLabel"></div>
      <div class="zone-sub" data-i18n="zoneSub"></div>
      <button class="zone-btn" data-i18n="zoneBtn" onclick="document.getElementById('examInput').click()"></button>
      <input type="file" id="examInput" accept=".docx,.pdf" style="display:none">
    </div>

    <div class="file-pill" id="filePill">
      <span id="pillIcon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
      <span class="pill-name" id="pillName">—</span>
      <span class="pill-size" id="pillSize">—</span>
      <button class="pill-remove" id="fileRemove">✕</button>
    </div>

    <div class="alert" id="alertBox"></div>
    <button class="extract-btn" id="extractBtn" data-i18n="extractBtn"></button>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label" id="progressLabel"></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    </div>

    <!-- Instruction + format example (always visible) -->
    <div class="upload-instruction-block">
      <p class="upload-instruction" data-i18n="cardSub"></p>
      <div class="doc-wrap">
        <div class="doc-page">
          <div class="doc-col">
            <span class="doc-q" id="exQ1"></span>
            <span class="doc-opt" id="exA"></span>
            <span class="doc-opt doc-correct"><span class="doc-star">*</span><span id="exB"></span></span>
            <span class="doc-opt" id="exC"></span>
            <span class="doc-opt" id="exD"></span>
          </div>
          <div class="doc-col">
            <span class="doc-q">
              <span id="exQ2"></span>
              <span class="doc-written-label" data-i18n="autoDetect"></span>
            </span>
            <span class="doc-opt" id="exWritten" style="color:#475569; font-style:italic;"></span>
          </div>
        </div>
      </div>
      <p class="upload-hint" data-i18n="noStarHint"></p>
    </div>
  </div>

  <!-- Results card — Step 1 success -->
  <div class="card results-card" id="resultsCard">
    <h2 data-i18n="resultsTitle"></h2>

    <div class="success-msg" id="successMsg"></div>
    <div class="alert" id="alertNoStar"></div>

    <button class="next-btn" id="nextBtn" data-i18n="nextBtn"></button>
  </div>

  <!-- AI extraction card — Step 2 -->
  <div class="card results-card" id="aiCard">
    <div class="step-done-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"/></svg>
      <span id="aiDoneLabel"></span>
    </div>
    <h2 data-i18n="aiTitle"></h2>
    <p class="card-sub" data-i18n="aiSub"></p>

    <!-- AI progress -->
    <div id="aiProgress">
      <div class="ai-spinner">
        <div class="spinner"></div>
        <span id="aiProgressLabel" data-i18n="aiProcessing"></span>
      </div>
    </div>

    <!-- AI results -->
    <div id="aiResults" style="display:none;">
      <div id="aiSuccessBanner" class="success-msg" style="display:none;margin-bottom:16px;"></div>
      <div class="ai-stats-row">
        <div class="stat"><div class="stat-label" data-i18n="aiMCQLabel"></div><div class="stat-value green" id="aiMCQCount">—</div></div>
        <div class="stat"><div class="stat-label" data-i18n="aiOpenLabel"></div><div class="stat-value purple" id="aiOpenCount">—</div></div>
        <div class="stat"><div class="stat-label" data-i18n="aiTotalLabel"></div><div class="stat-value" id="aiTotalCount">—</div></div>
      </div>

      <div class="alert" id="aiAlert" style="margin-top:16px;"></div>
    </div>
  </div>

  <!-- Review card — Step 3 -->
  <div class="card results-card" id="reviewCard">
    <h2 data-i18n="reviewTitle"></h2>
    <p class="card-sub" data-i18n="reviewSub"></p>
    <div class="review-instructions-box" data-i18n-html="reviewInstructions"></div>

    <!-- Exam metadata -->
    <div class="exam-meta">
      <div class="meta-field">
        <label class="meta-label" data-i18n="metaTitleLabel"></label>
        <input type="text" id="examTitle" class="meta-input" data-i18n-placeholder="metaTitlePlaceholder">
        <div id="examTitleError" style="display:none;font-size:0.75rem;color:#dc2626;margin-top:4px;font-weight:600;" data-i18n="metaTitleRequired"></div>
      </div>
      <div class="meta-field meta-field-sm">
        <label class="meta-label" data-i18n="metaDurationLabel"></label>
        <div class="meta-duration">
          <input type="number" id="examDuration" class="meta-input" value="20" min="5" max="180">
          <span class="meta-unit" data-i18n="metaDurationUnit"></span>
        </div>
      </div>
    </div>

    <!-- Review stats -->
    <div class="review-stats">
      <span id="reviewTotalStat"></span>
    </div>

    <!-- Drag instructions -->

    <!-- Lang and groups — hidden inputs kept for publish logic, UI moved to onboarding -->
    <div style="display:none;">
      <div class="exam-lang-toggle">
        <button class="exam-lang-btn active" id="examLangFR" onclick="setExamLang('fr')">Français</button>
        <button class="exam-lang-btn" id="examLangEN" onclick="setExamLang('en')">English</button>
      </div>
      <input type="text" id="examGroups">
    </div>

    <div class="drag-instructions" id="dragInstructions">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <rect x="2" y="2" width="10" height="2" rx="1" fill="#94a3b8"/>
        <rect x="2" y="6" width="10" height="2" rx="1" fill="#94a3b8"/>
        <rect x="2" y="10" width="10" height="2" rx="1" fill="#94a3b8"/>
      </svg>
      <span data-i18n="dragInstructions"></span>
    </div>

    <!-- Editable question list -->
    <div id="reviewList"></div>

    <!-- Add question -->
    <button class="add-q-btn" id="addQuestionBtn" data-i18n="addQuestion"></button>

    <!-- Teacher email — hidden, auto-set from session -->
    <input type="email" id="teacherEmailPre" style="display:none;">

    <!-- Publish -->
    <button class="publish-btn" id="publishBtn" data-i18n="publishBtn"></button>

    <!-- Publish result — shown after successful publish -->
    <div id="publishResult" style="display:none; margin-top:20px; border:1px solid #e2e8f0; border-radius:14px; overflow:hidden;">

      <!-- Green header -->
      <div style="background:linear-gradient(135deg,#16a34a,#15803d);padding:16px 22px;">
        <div style="font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.6);margin-bottom:3px;" data-i18n="publishedLabel"></div>
        <div style="font-size:0.95rem;font-weight:700;color:#fff;">✅ <span data-i18n="publishedTitle"></span></div>
      </div>

      <div style="padding:20px 22px;background:#fff;">

        <!-- Exam info -->
        <div style="display:flex;align-items:center;gap:12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 16px;margin-bottom:18px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <div>
            <div id="publishedExamTitle" style="font-size:0.88rem;font-weight:700;color:#0f172a;"></div>
            <div id="publishedExamMeta" style="font-size:0.73rem;color:#64748b;margin-top:2px;"></div>
          </div>
        </div>

        <!-- Exam link -->
        <div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#94a3b8;margin-bottom:7px;" data-i18n="publishedLinkLabel"></div>
        <div style="display:flex;gap:8px;margin-bottom:18px;">
          <input id="shareUrlDisplay" type="text" readonly onclick="this.select()"
            style="flex:1;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:0.78rem;font-family:monospace;color:#0f172a;background:#f8fafc;min-width:0;cursor:text;">
          <button id="copyLinkBtn" onclick="copyShareLink()"
            style="display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:0.82rem;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            <span data-i18n="copyLinkBtn">Copy</span>
          </button>

  let lang = (localStorage.getItem('examBuilderLang') || 'fr');
  let examLang = 'fr'; // Language for student-facing exam UI
  let currentFile = null;
  let extractedText = '';

  // ── Language switch ───────────────────────────────────────────
  function setLang(l) {
    lang = l;
    const t = i18n[l];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key] !== undefined) el.textContent = t[key];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const key = el.getAttribute('data-i18n-html');
      if (t[key] !== undefined) el.innerHTML = t[key];
    });
    // Dynamic elements
    document.getElementById('exQ1').textContent    = t.exQ1;
    document.getElementById('exA').textContent     = t.exA;
    document.getElementById('exB').textContent     = ' ' + t.exB;
    document.getElementById('exC').textContent     = t.exC;
    document.getElementById('exD').textContent     = t.exD;
    document.getElementById('exQ2').textContent    = t.exQ2;
    document.getElementById('exWritten').textContent = t.exWritten;
  }

  setLang(lang);

  let onboardingData = null;
  try {
    const raw = localStorage.getItem('examOnboarding');
    if (raw) {
      onboardingData = JSON.parse(raw);
      localStorage.removeItem('examOnboarding'); // consume it

      if (onboardingData.title)    document.getElementById('examTitle').value    = onboardingData.title;
      if (onboardingData.duration) document.getElementById('examDuration').value = onboardingData.duration;
      if (onboardingData.lang)     setExamLang(onboardingData.lang);
      if (onboardingData.groups?.length) {
        document.getElementById('examGroups').value = onboardingData.groups.map(g => g.name).join(', ');

      buildReviewList();
      updateReviewStats();
    }
