<!DOCTYPE html>
<html lang="en">
<!-- v2 -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Builder — Institution</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black:    #0a0a0a;
      --navy:     #0f172a;
      --ink:      #1e293b;
      --slate:    #475569;
      --muted:    #94a3b8;
      --line:     #e2e8f0;
      --surface:  #f8fafc;
      --white:    #ffffff;
      --blue:     #2563eb;
      --green:    #16a34a;
      --amber:    #d97706;
      --red:      #dc2626;
      --purple:   #7c3aed;
      --transition: 180ms ease;
    }
    body { font-family: 'Inter', sans-serif; background: var(--surface); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ── Header ── */
    .header { background: var(--navy); padding: 0 40px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .back-btn { display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.5); font-size: 0.72rem; font-weight: 600; background: none; border: none; cursor: pointer; font-family: inherit; transition: color var(--transition); letter-spacing: 0.04em; }
    .back-btn:hover { color: var(--white); }
    .header-divider { width: 1px; height: 18px; background: rgba(255,255,255,0.1); }
    .header-logo img { height: 26px; width: auto; }
    .header-badge { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.15); padding: 2px 8px; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .header-avatar { width: 28px; height: 28px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); font-size: 0.65rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .user-menu { position: relative; display: flex; align-items: center; }
    .user-menu-btn { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.6); font-size: 0.78rem; font-weight: 600; font-family: inherit; padding: 5px 8px; transition: color var(--transition); }
    .user-menu-btn:hover { color: rgba(255,255,255,0.9); }
    .user-menu-btn .um-caret { transition: transform var(--transition); }
    .user-menu-btn.open .um-caret { transform: rotate(180deg); }
    .user-dropdown { display: none; position: absolute; right: 0; top: calc(100% + 6px); background: var(--navy); border: 1px solid rgba(255,255,255,0.08); min-width: 160px; z-index: 500; box-shadow: 0 8px 28px rgba(0,0,0,0.35); }
    .user-dropdown.open { display: block; }
    .user-dropdown-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; background: transparent; border: none; color: rgba(255,255,255,0.6); font-size: 0.82rem; font-weight: 500; font-family: inherit; cursor: pointer; text-align: left; transition: all var(--transition); white-space: nowrap; }
    .user-dropdown-item:hover { background: rgba(255,255,255,0.06); color: var(--white); }

    /* ── Page ── */
    .page { max-width: 1100px; margin: 0 auto; padding: 48px 40px 80px; }

    /* ── Institution hero ── */
    .inst-hero { background: var(--white); border: 1px solid var(--line); padding: 24px 28px; display: flex; align-items: center; gap: 20px; margin-bottom: 32px; }
    .inst-hero-logo { width: 64px; height: 64px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--muted); overflow: hidden; flex-shrink: 0; }
    .inst-hero-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
    .inst-hero-info { flex: 1; }
    .inst-hero-name { font-size: 1.25rem; font-weight: 800; color: var(--black); letter-spacing: -0.02em; margin-bottom: 4px; }
    .inst-hero-domain { font-size: 0.82rem; color: var(--muted); font-family: monospace; }

    /* ── Stats ── */
    .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--line); margin-bottom: 40px; }
    .stat-card { padding: 20px 24px; border-right: 1px solid var(--line); background: var(--white); }
    .stat-card:last-child { border-right: none; }
    .stat-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 8px; }
    .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--black); letter-spacing: -0.03em; line-height: 1; }
    .stat-value.blue   { color: var(--blue); }
    .stat-value.green  { color: var(--green); }
    .stat-value.purple { color: var(--purple); }

    /* ── Section card ── */
    .section { margin-bottom: 32px; }
    .section-card { border: 1px solid var(--line); }
    .section-card-head { background: var(--navy); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
    .section-card-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: rgba(255,255,255,0.85); }
    .add-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--blue); color: var(--white); border: none; padding: 7px 14px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: background var(--transition); }
    .add-btn:hover { background: #1d4ed8; }

    /* ── Member list ── */
    .member-list { background: var(--white); }
    .member-row { padding: 14px 20px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--line); }
    .member-row:last-child { border-bottom: none; }
    .member-avatar { width: 36px; height: 36px; background: var(--blue); color: var(--white); font-size: 0.65rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .member-avatar.green  { background: var(--green); }
    .member-avatar.purple { background: var(--purple); }
    .member-info { flex: 1; min-width: 0; }
    .member-name { font-size: 0.88rem; font-weight: 700; color: var(--black); margin-bottom: 2px; }
    .member-email { font-size: 0.75rem; color: var(--muted); font-family: monospace; }
    .member-meta { font-size: 0.75rem; color: var(--slate); margin-top: 2px; }
    .class-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .class-tag { font-size: 0.68rem; font-weight: 600; background: #eff6ff; color: var(--blue); border: 1px solid #bfdbfe; padding: 2px 8px; }
    .remove-btn { background: none; border: none; cursor: pointer; color: var(--line); padding: 6px; transition: color var(--transition), background var(--transition); flex-shrink: 0; }
    .remove-btn:hover { color: var(--red); background: #fef2f2; }

    /* ── Exam list ── */
    .exam-row { padding: 14px 20px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--line); }
    .exam-row:last-child { border-bottom: none; }
    .exam-info { flex: 1; }
    .exam-title { font-size: 0.88rem; font-weight: 700; color: var(--black); margin-bottom: 2px; }
    .exam-meta { font-size: 0.75rem; color: var(--muted); }
    .exam-badge { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: #f0fdf4; color: var(--green); border: 1px solid #86efac; padding: 3px 10px; flex-shrink: 0; }

    /* ── Empty state ── */
    .empty-state { padding: 32px 24px; text-align: center; background: var(--white); }
    .empty-title { font-size: 0.88rem; font-weight: 700; color: var(--black); margin-bottom: 4px; }
    .empty-sub { font-size: 0.78rem; color: var(--muted); }

    /* ── Modal ── */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .modal { background: var(--white); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .modal-header { padding: 24px 28px 0; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-title { font-size: 1rem; font-weight: 700; color: var(--black); }
    .modal-close { background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; }
    .modal-close:hover { color: var(--black); }
    .modal-body { padding: 0 28px 28px; }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--slate); margin-bottom: 5px; }
    .req { color: var(--red); font-weight: 700; margin-left: 2px; }
    .modal-field input { width: 100%; padding: 9px 12px; border: 1.5px solid var(--line); font-size: 0.88rem; font-family: inherit; color: var(--black); outline: none; transition: border-color var(--transition); }
    .modal-field input:focus { border-color: var(--blue); }
    .modal-row { display: flex; gap: 12px; }
    .modal-row .modal-field { flex: 1; }
    .modal-section-label { font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin: 20px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .modal-submit { width: 100%; background: var(--blue); color: var(--white); border: none; padding: 12px; font-size: 0.9rem; font-weight: 700; font-family: inherit; cursor: pointer; transition: background var(--transition); margin-top: 8px; }
    .modal-submit:hover { background: #1d4ed8; }
    .modal-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .modal-error { font-size: 0.8rem; color: var(--red); background: #fef2f2; border: 1px solid #fecaca; padding: 8px 12px; margin-top: 10px; display: none; }
    .modal-success { font-size: 0.8rem; color: var(--green); background: #f0fdf4; border: 1px solid #86efac; padding: 8px 12px; margin-top: 10px; display: none; }

    /* ── Classes input ── */
    .class-input-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .class-input-row input { flex: 1; padding: 8px 12px; border: 1.5px solid var(--line); font-size: 0.85rem; font-family: inherit; color: var(--black); outline: none; transition: border-color var(--transition); }
    .class-input-row input:focus { border-color: var(--blue); }
    .class-remove-btn { background: none; border: 1.5px solid var(--line); color: var(--muted); width: 32px; height: 32px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: all var(--transition); flex-shrink: 0; }
    .class-remove-btn:hover { border-color: #fca5a5; color: var(--red); background: #fef2f2; }
    .add-class-btn { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1.5px dashed var(--line); color: var(--slate); padding: 7px 14px; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: inherit; width: 100%; justify-content: center; transition: all var(--transition); margin-top: 4px; }
    .add-class-btn:hover { border-color: var(--blue); color: var(--blue); background: #eff6ff; }

    /* ── Remove confirm modal ── */
    .remove-warning { background: #fef2f2; border: 1px solid #fecaca; padding: 14px 16px; margin-bottom: 20px; font-size: 0.85rem; color: #7f1d1d; line-height: 1.6; }
    .remove-cancel-btn { width: 100%; background: var(--surface); color: var(--black); border: 1.5px solid var(--line); padding: 11px; font-size: 0.88rem; font-weight: 600; font-family: inherit; cursor: pointer; margin-bottom: 8px; transition: background var(--transition); }
    .remove-cancel-btn:hover { background: var(--line); }
    .remove-confirm-btn { width: 100%; background: var(--red); color: var(--white); border: none; padding: 11px; font-size: 0.88rem; font-weight: 700; font-family: inherit; cursor: pointer; transition: background var(--transition); }
    .remove-confirm-btn:hover { background: #b91c1c; }

    /* ── Key contact ── */
    .key-contact-badge { font-size: 0.65rem; font-weight: 700; background: #fef9c3; color: #854d0e; border: 1px solid #fde68a; padding: 2px 8px; margin-left: 6px; vertical-align: middle; }
    .key-contact-toggle { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); padding: 10px 14px; margin-bottom: 14px; cursor: pointer; transition: border-color var(--transition); }
    .key-contact-toggle:hover { border-color: var(--blue); }
    .key-contact-toggle input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--blue); cursor: pointer; flex-shrink: 0; }
    .key-contact-toggle-label { font-size: 0.82rem; font-weight: 600; color: var(--slate); }
    .key-contact-toggle-sub { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }

    /* ── Skeleton ── */
    .skeleton { background: linear-gradient(90deg, var(--surface) 25%, var(--line) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media (max-width: 640px) {
      .header { padding: 0 20px; }
      .page { padding: 24px 20px 60px; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <button class="back-btn" onclick="window.location.href='dashboard.html'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        <span id="backBtnText">All Institutions</span>
      </button>
      <div class="header-divider"></div>
      <div class="header-logo"><img src="testflo-dark.svg" alt="testflo"></div>
      <div class="header-divider"></div>
      <span class="header-badge" data-i18n="badge">Admin</span>
    </div>
    <div class="header-right">
      <div id="langToggleMount"></div>
      <div class="user-menu" id="userMenu">
        <button class="user-menu-btn" id="userMenuBtn" onclick="toggleUserMenu()">
          <div class="header-avatar" id="headerAvatar">—</div>
          <span id="headerName">—</span>
          <svg class="um-caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="user-dropdown" id="userDropdown">
          <button class="user-dropdown-item" onclick="signOut()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Page -->
  <div class="page" id="pageContent" style="display:none;">

    <!-- Institution hero -->
    <div class="inst-hero">
      <div style="position:relative;flex-shrink:0;">
        <div class="inst-hero-logo" id="instLogo">—</div>
        <input type="file" id="heroLogoInput" accept="image/*" style="display:none;" onchange="uploadHeroLogo(event)">
        <button onclick="document.getElementById('heroLogoInput').click()" title="Upload logo"
          style="position:absolute;bottom:-6px;right:-6px;width:22px;height:22px;background:var(--blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
      </div>
      <div class="inst-hero-info">
        <div class="inst-hero-name" id="instName">Loading…</div>
        <div class="inst-hero-domain" id="instDomain">—</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-label" data-i18n="statAdmins">Admins</div><div class="stat-value blue" id="statAdmins">—</div></div>
      <div class="stat-card"><div class="stat-label" data-i18n="statTeachers">Teachers</div><div class="stat-value green" id="statTeachers">—</div></div>
      <div class="stat-card"><div class="stat-label" data-i18n="statClasses">Classes</div><div class="stat-value purple" id="statClasses">—</div></div>
      <div class="stat-card"><div class="stat-label" data-i18n="statExams">Exams</div><div class="stat-value" id="statExams">—</div></div>
    </div>

    <!-- Admins section -->
    <div class="section">
      <div class="section-card">
        <div class="section-card-head">
          <span class="section-card-title" data-i18n="sectionAdmins">Admins</span>
          <button class="add-btn" onclick="openAddModal('admin')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span data-i18n="addAdmin">Add Admin</span>
          </button>
        </div>
        <div id="adminList">
          <div class="empty-state"><div class="empty-title" data-i18n="emptyAdmins">No admins yet</div></div>
        </div>
      </div>
    </div>

    <!-- Teachers section -->
    <div class="section">
      <div class="section-card">
        <div class="section-card-head">
          <span class="section-card-title" data-i18n="sectionTeachers">Teachers</span>
          <button class="add-btn" onclick="openAddModal('teacher')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span data-i18n="addTeacher">Add Teacher</span>
          </button>
        </div>
        <div id="teacherList">
          <div class="empty-state"><div class="empty-title" data-i18n="emptyTeachers">No teachers yet</div></div>
        </div>
      </div>
    </div>

    <!-- Exams section -->
    <div class="section">
      <div class="section-card">
        <div class="section-card-head">
          <span class="section-card-title" data-i18n="sectionExams">Exams</span>
        </div>
        <div id="examList">
          <div class="empty-state"><div class="empty-title" data-i18n="emptyExams">No exams yet</div></div>
        </div>
      </div>
    </div>

  </div>

  <!-- ── Add Admin / Teacher Modal ── -->
  <div class="modal-backdrop" id="addModal" style="display:none;" onclick="handleAddBackdrop(event)">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="addModalTitle">Add Member</div>
        <button class="modal-close" onclick="closeAddModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-row">
          <div class="modal-field"><label data-i18n="firstName">First name <span class="req">*</span></label><input type="text" id="mFirst" data-i18n-placeholder="firstNamePH" placeholder="Marie"></div>
          <div class="modal-field"><label data-i18n="lastName">Last name <span class="req">*</span></label><input type="text" id="mLast" data-i18n-placeholder="lastNamePH" placeholder="Dupont"></div>
        </div>
        <div class="modal-field"><label data-i18n="email">Email <span class="req">*</span></label><input type="email" id="mEmail" data-i18n-placeholder="emailPH" placeholder="marie@institution.fr"></div>

        <!-- Admin only: job title -->
        <div id="adminFields">
          <div class="modal-field"><label data-i18n="jobTitle">Job title</label><input type="text" id="mJobTitle" data-i18n-placeholder="jobTitlePH" placeholder="Head of Academic Affairs"></div>
        </div>

        <!-- Key contact toggle (admins only) -->
        <div id="keyContactSection">
          <label class="key-contact-toggle" onclick="toggleKeyContact()">
            <input type="checkbox" id="mIsKeyContact" onchange="toggleKeyContact()">
            <div>
              <div class="key-contact-toggle-label" id="keyContactLabel" data-i18n="keyContactLabel">Set as key contact</div>
              <div class="key-contact-toggle-sub" id="keyContactSub" data-i18n="keyContactSub">Designates this person as the primary contact for this institution</div>
            </div>
          </label>
          <div id="phoneField" style="display:none;">
            <div class="modal-field"><label id="phoneLabel" data-i18n="phone">Phone number <span class="req">*</span></label><input type="tel" id="mPhone" data-i18n-placeholder="phonePH" placeholder="+33 6 00 00 00 00"></div>
          </div>
        </div>

        <!-- Teacher only: classes -->
        <div id="teacherFields" style="display:none;">
          <div class="modal-section-label">Classes</div>
          <div id="classInputsContainer"></div>
          <button type="button" class="add-class-btn" onclick="addClassInput()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add class
          </button>
        </div>

        <button class="modal-submit" id="addSubmitBtn" onclick="submitMember()">Add Member</button>
        <div class="modal-error" id="addError"></div>
        <div class="modal-success" id="addSuccess"></div>
      </div>
    </div>
  </div>

  <!-- ── Remove Confirm Modal ── -->
  <div class="modal-backdrop" id="removeModal" style="display:none;" onclick="handleRemoveBackdrop(event)">
    <div class="modal" style="max-width:400px;">
      <div class="modal-header">
        <div class="modal-title">Remove Member</div>
        <button class="modal-close" onclick="closeRemoveModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="remove-warning" id="removeWarningText"></div>
        <button class="remove-cancel-btn" onclick="closeRemoveModal()">Cancel</button>

    // ── i18n helper — delegates to shared Lang ────────────────────
    function T(key) { return Lang.t(key); }

    // ── Auth ─────────────────────────────────────────────────────

    async function init() {
      if (!instId) { window.location.href = 'dashboard.html'; return; }

      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'dashboard.html'; return; }

      await sb.auth.setSession({ access_token: session.access_token, refresh_token: session.refresh_token });

      currentUser = session.user;
      const { data: teacher } = await sb.from('teachers').select('*').eq('id', session.user.id).single();
      if (!teacher) { window.location.href = 'dashboard.html'; return; }
      currentTeacher = teacher;

      const initials = (teacher.full_name || '').split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase();
      document.getElementById('headerAvatar').textContent = initials;
      document.getElementById('headerName').textContent   = teacher.full_name || teacher.email;

      Lang.init(i18n);
      document.getElementById('pageContent').style.display = 'block';
      await loadPage();

      document.addEventListener('langchange', () => rerender());
    }

    async function signOut() {
      await sb.auth.signOut();
      window.location.href = 'dashboard.html';
    }

    // ── Load page data ────────────────────────────────────────────

    async function loadPage() {
      const [instRes, adminLinksRes, teacherLinksRes] = await Promise.all([
        sb.from('institutions').select('*').eq('id', instId).single(),
        sb.from('institution_admins').select('teacher_id, is_key_contact').eq('institution_id', instId),
        sb.from('institution_teachers').select('teacher_id, is_key_contact').eq('institution_id', instId)
      ]);


      const inst           = instRes.data;
      const adminLinks     = adminLinksRes.data  || [];
      const teacherLinks   = teacherLinksRes.data || [];

      if (!inst) { window.location.href = 'dashboard.html'; return; }

      // Institution hero
      document.title = `${inst.name} — Exam Builder`;
      document.getElementById('instName').textContent   = inst.name;
      document.getElementById('instDomain').textContent = inst.domain || '—';
      const logoEl = document.getElementById('instLogo');
      if (inst.logo_url) {
        logoEl.innerHTML = `<img src="${inst.logo_url}" alt="${inst.name}">`;
      } else {
        logoEl.textContent = inst.name.substring(0,4).toUpperCase();
      }

      // Fetch teacher details for admins and teachers
      const allIds = [...new Set([...adminLinks.map(a => a.teacher_id), ...teacherLinks.map(t => t.teacher_id)])];

      let teachers = [];
      if (allIds.length > 0) {
        const { data, error } = await sb.from('teachers').select('*').in('id', allIds);
        teachers = data || [];
      }

      // Fetch classes for teachers
      const teacherIds = teacherLinks.map(t => t.teacher_id);
      let classes = [];
      if (teacherIds.length > 0) {
        const { data } = await sb.from('classes').select('*').in('teacher_id', teacherIds);
        classes = data || [];
      }

      // Fetch exams
      const { data: exams } = teacherIds.length > 0
        ? await sb.from('exams').select('*').in('teacher_id', teacherIds).order('created_at', { ascending: false })
        : { data: [] };

      // Cache for live re-render
      _adminLinks   = adminLinks;
      _teacherLinks = teacherLinks;
      _teachers     = teachers;
      _classes      = classes;
      _exams        = exams || [];

      rerender();
    }

    function rerender() {
      const adminLinks   = _adminLinks;
      const teacherLinks = _teacherLinks;
      const teachers     = _teachers;
      const classes      = _classes;
      const exams        = _exams;

      document.getElementById('statAdmins').textContent   = adminLinks.length;
      document.getElementById('statTeachers').textContent = teacherLinks.length;
      document.getElementById('statClasses').textContent  = classes.length;
      document.getElementById('statExams').textContent    = exams.length;

      renderAdmins(adminLinks, teachers);
      renderTeachers(teacherLinks, teachers, classes);
      renderExams(exams, teachers);
    }

    function renderAdmins(links, teachers) {
      const el = document.getElementById('adminList');
      if (links.length === 0) {
        el.innerHTML = `<div class="empty-state"><div class="empty-title">No admins yet</div></div>`;
        return;
      }
      el.innerHTML = links.map(link => {
        const t = teachers.find(t => t.id === link.teacher_id);
        if (!t) return '';
        const initials = (t.full_name || t.email).split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase();
        return `
          <div class="member-row">
            <div class="member-avatar">${initials}</div>
            <div class="member-info">
              <div class="member-name">${t.full_name || '—'}${link.is_key_contact ? '<span class="key-contact-badge">Key Contact</span>' : ''}</div>
              <div class="member-email">${t.email}</div>
              ${t.job_title ? `<div class="member-meta">${t.job_title}</div>` : ''}
              ${link.is_key_contact && t.phone ? `<div class="member-meta">${t.phone}</div>` : ''}
            </div>
            <button class="remove-btn" onclick="openRemoveModal('${t.id}', 'admin', '${(t.full_name || t.email).replace(/'/g,"\\'")}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>`;
      }).join('');
    }

    function renderTeachers(links, teachers, classes) {
      const el = document.getElementById('teacherList');
      if (links.length === 0) {
        el.innerHTML = `<div class="empty-state"><div class="empty-title">No teachers yet</div></div>`;
        return;
      }
      el.innerHTML = links.map(link => {
        const t = teachers.find(t => t.id === link.teacher_id);
        if (!t) return '';
        const initials  = (t.full_name || t.email).split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase();
        return `
          <div class="member-row" onclick="window.location.href='dashboard.html?preview=${t.id}'" style="cursor:pointer;">
            <div class="member-avatar green">${initials}</div>
            <div class="member-info">
              <div class="member-name">${t.full_name || '—'}${link.is_key_contact ? '<span class="key-contact-badge">Key Contact</span>' : ''}</div>
              <div class="member-email">${t.email}</div>
              ${link.is_key_contact && t.phone ? `<div class="member-meta">${t.phone}</div>` : ''}
            </div>
            <button class="remove-btn" onclick="event.stopPropagation(); openRemoveModal('${t.id}', 'teacher', '${(t.full_name || t.email).replace(/'/g,"\\'")}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>`;
      }).join('');
    }

    function renderExams(exams, teachers) {
      const el = document.getElementById('examList');
      if (exams.length === 0) {
        el.innerHTML = `<div class="empty-state"><div class="empty-title">No exams published yet</div></div>`;
        return;
      }
      el.innerHTML = exams.map(exam => {
        const t    = teachers.find(t => t.id === exam.teacher_id);
        const date = new Date(exam.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
        return `
          <div class="exam-row">
            <div class="exam-info">
              <div class="exam-title">${exam.title || 'Untitled exam'}</div>
              <div class="exam-meta">${t ? t.full_name : '—'} · ${date} · ${exam.duration_mins} min</div>
            </div>
            <div class="exam-badge">Published</div>
          </div>`;
      }).join('');
    }

    // ── Add modal ─────────────────────────────────────────────────

    function openAddModal(role) {
      addModalRole = role;
      classInputs  = [''];
      document.getElementById('addModalTitle').textContent   = role === 'admin' ? T('modalAddAdmin') : T('modalAddTeacher');
      document.getElementById('addSubmitBtn').textContent    = role === 'admin' ? T('submitAdmin')   : T('submitTeacher');
      document.getElementById('adminFields').style.display   = role === 'admin'   ? 'block' : 'none';
      document.getElementById('teacherFields').style.display = role === 'teacher' ? 'block' : 'none';
      // Key contact only applies to admins
      document.getElementById('keyContactSection').style.display = role === 'admin' ? 'block' : 'none';
      ['mFirst','mLast','mEmail','mPhone','mJobTitle'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('mIsKeyContact').checked    = false;
      document.getElementById('phoneField').style.display = 'none';
      document.getElementById('addError').style.display   = 'none';
      document.getElementById('addSuccess').style.display = 'none';
      document.getElementById('addSubmitBtn').disabled    = false;
      if (role === 'teacher') renderClassInputs();
      document.getElementById('addModal').style.display = 'flex';
    }

    function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }
    function handleAddBackdrop(e) { if (e.target === document.getElementById('addModal')) closeAddModal(); }

    function toggleKeyContact() {
      const checked = document.getElementById('mIsKeyContact').checked;
      document.getElementById('phoneField').style.display = checked ? 'block' : 'none';
    }

    function renderClassInputs() {
      const container = document.getElementById('classInputsContainer');
      container.innerHTML = classInputs.map((val, i) => `
        <div class="class-input-row">
          <input type="text" placeholder="Class name" value="${val}"
            oninput="classInputs[${i}] = this.value"
            onkeydown="if(event.key==='Enter'){event.preventDefault();addClassInput();}">
          ${classInputs.length > 1
            ? `<button type="button" class="class-remove-btn" onclick="removeClassInput(${i})">×</button>`
            : ''}
        </div>`).join('');
    }

    function addClassInput() {
      classInputs.push('');
      renderClassInputs();
      const inputs = document.querySelectorAll('#classInputsContainer input');
      if (inputs.length) inputs[inputs.length - 1].focus();
    }

    function removeClassInput(i) {
      classInputs.splice(i, 1);
      renderClassInputs();
    }

    async function submitMember() {
      const firstName = document.getElementById('mFirst').value.trim();
      const lastName  = document.getElementById('mLast').value.trim();
      const email     = document.getElementById('mEmail').value.trim();
      const phone        = document.getElementById('mPhone').value.trim();
      const jobTitle     = document.getElementById('mJobTitle').value.trim();
      const isKeyContact = document.getElementById('mIsKeyContact').checked;
      const errEl     = document.getElementById('addError');
      const succEl    = document.getElementById('addSuccess');
      const btn       = document.getElementById('addSubmitBtn');

      errEl.style.display = succEl.style.display = 'none';

      const missing = [];
      if (!firstName)                        missing.push(Lang.t('firstName'));
      if (!lastName)                         missing.push(Lang.t('lastName'));
      if (!email || !email.includes('@'))    missing.push(Lang.t('email'));
      if (isKeyContact && !phone)            missing.push(Lang.t('phone'));

      if (missing.length) {
        errEl.textContent   = (Lang.get() === 'fr' ? 'Champs requis : ' : 'Required: ') + missing.join(', ');
        errEl.style.display = 'block';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Adding…';

      const { data: { session } } = await sb.auth.getSession();

      try {
        const res = await fetch(ADD_MEMBER_URL, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({
            institution_id:   instId,
            role:             addModalRole,
            email,
            full_name:        `${firstName} ${lastName}`,
            phone:             isKeyContact ? (phone || null) : null,
            job_title:         jobTitle || null,
            is_key_contact:    isKeyContact,
            classes:           addModalRole === 'teacher' ? classInputs.filter(c => c.trim()) : [],
            invited_by_name:   currentTeacher?.full_name || currentTeacher?.email || ''
          })
        });

        const result = await res.json();
        if (!res.ok || result.error) throw new Error(result.error || 'Unknown error');

        if (result.invited) {
          succEl.innerHTML = `<strong>${firstName} ${lastName}</strong> added.<br>
            <span style="font-size:0.82rem;color:#475569;">An invitation email has been sent to <strong>${email}</strong> with a secure link to set their password.</span>`;
          // Notify the admin who triggered the invite
          const { data: { session: s } } = await sb.auth.getSession();
          if (s) {
            fetch(ADD_MEMBER_URL.replace('add-member', 'send-email'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${s.access_token}` },
              body: JSON.stringify({
                type: 'admin-notify',
                to_email:    s.user.email,
                added_name:  `${firstName} ${lastName}`,
                added_email: email,
                added_role:  addModalRole,
              }),
            }).catch(() => {});
          }
        } else {
          succEl.innerHTML = `<strong>${firstName} ${lastName}</strong> added. Account linked.`;
        }
        succEl.style.display = 'block';
        btn.textContent      = 'Done';
        btn.onclick          = closeAddModal;

        await loadPage();

      } catch (err) {
        errEl.textContent   = 'Error: ' + err.message;
        errEl.style.display = 'block';
        btn.disabled        = false;
        btn.textContent     = addModalRole === 'admin' ? 'Add Admin' : 'Add Teacher';
      }
    }

    // ── Remove modal ──────────────────────────────────────────────

    function openRemoveModal(teacherId, role, name) {
      removeTargetId   = teacherId;
      removeTargetRole = role;
      document.getElementById('removeWarningText').innerHTML =
        `This will remove <strong>${name}</strong> from this institution.<br>
         Their account will not be deleted — they will simply lose access to this institution.`;
      document.getElementById('removeModal').style.display = 'flex';
    }

    function closeRemoveModal() { document.getElementById('removeModal').style.display = 'none'; }
    function handleRemoveBackdrop(e) { if (e.target === document.getElementById('removeModal')) closeRemoveModal(); }

    async function confirmRemove() {
      const btn   = document.getElementById('removeConfirmBtn');
      btn.disabled    = true;
      btn.textContent = 'Removing…';

      const table = removeTargetRole === 'admin' ? 'institution_admins' : 'institution_teachers';
      const { error } = await sb.from(table).delete()
        .eq('institution_id', instId)
        .eq('teacher_id', removeTargetId);

      if (error) {
        alert('Remove failed: ' + error.message);
        btn.disabled    = false;
        btn.textContent = 'Remove';
        return;
      }

      closeRemoveModal();
      await loadPage();
    }

    async function uploadHeroLogo(e) {
      const file = e.target.files[0];
      if (!file) return;
      const ext  = file.name.split('.').pop();
      const path = `${instId}/logo-${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from('institution-logos').upload(path, file, { upsert: true });
      if (upErr) { alert('Upload failed: ' + upErr.message); return; }
      const { data: { publicUrl } } = sb.storage.from('institution-logos').getPublicUrl(path);
      const { error: dbErr } = await sb.from('institutions').update({ logo_url: publicUrl }).eq('id', instId);
      if (dbErr) { alert('Save failed: ' + dbErr.message); return; }
      const logoEl = document.getElementById('instLogo');
      logoEl.innerHTML = `<img src="${publicUrl}" alt="logo">`;
    }

    init();

    function toggleUserMenu() {
      var d = document.getElementById('userDropdown');
      var b = document.getElementById('userMenuBtn');
      var isOpen = d.classList.contains('open');
      d.classList.toggle('open', !isOpen);
      b.classList.toggle('open', !isOpen);
    }
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#userMenu')) {
        var d = document.getElementById('userDropdown');
        var b = document.getElementById('userMenuBtn');
        if (d) { d.classList.remove('open'); }
        if (b) { b.classList.remove('open'); }
      }
    });
  </script>
